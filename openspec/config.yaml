schema: spec-driven

context: |
  Language: pt-BR
  All artifacts must be written in pt-BR.
  Keep OpenSpec structural headings and SHALL/MUST keywords in English.

  Produto: {{Nome do Projeto}}
  Objetivos: A definir

  Stack: A definir
  Arquitetura: A definir

  Git: Conventional Commits. Toda mudança de comportamento
  passa por /opsx:propose antes do código.

rules:
  proposal:
    - Sempre declarar explicitamente o que está fora do escopo
  specs:
    - Todo requisito precisa de ao menos um cenário testável
  tasks:
    - Cada tarefa deve caber em uma sessão de trabalho e dizer como verificar a conclusão

operations:
  apply:
    guidance:
      - Seguir as convenções de stack definidas em project.md
  archive:
    guidance:
      - Rodar /opsx:verify antes de arquivar e resumir o resultado
