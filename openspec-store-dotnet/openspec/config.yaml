schema: spec-driven

context: |
  Language: pt-BR
  All artifacts must be written in pt-BR.
  Keep OpenSpec structural headings and SHALL/MUST keywords in English.

  Stack: .NET (8 LTS ou 9), C# com nullable reference types habilitado.

  Opções de projeto web:
  - Minimal API: endpoints declarados diretamente em Program.cs, sem controllers
  - Web API com Controllers: MVC pattern, ControllerBase, atributos de rota
  - Blazor Server ou WebAssembly: componentes Razor para UI interativa
  - MVC: Model-View-Controller para aplicações com server-side rendering

  Opções de acesso a dados:
  - Entity Framework Core com SQL Server (Microsoft.EntityFrameworkCore.SqlServer)
  - Entity Framework Core com PostgreSQL (Npgsql.EntityFrameworkCore.PostgreSQL)
  - Entity Framework Core com SQLite (Microsoft.EntityFrameworkCore.Sqlite)
  - Dapper para acesso leve e direto ao banco via SQL

  Autenticação:
  - ASP.NET Core Identity para autenticação local
  - JWT Bearer tokens para APIs stateless
  - OAuth2 / OpenID Connect via Microsoft.Identity.Web (Azure AD, etc.)

  Validação: FluentValidation ou Data Annotations.
  Logging: Serilog ou Microsoft.Extensions.Logging nativo.
  Testes: xUnit ou NUnit, com Moq ou NSubstitute para mocks.
  Documentação de API: Swagger via Swashbuckle ou Scalar.

  Arquitetura: definir por projeto (Clean Architecture, Vertical Slice, N-Tier).
  Regras de negócio ficam nos serviços ou handlers, nunca em controllers ou endpoints.
  Entradas validadas antes de chegar na camada de domínio.

  Git: trunk-based, PR obrigatório, Conventional Commits.
  Toda mudança de comportamento passa por /opsx:propose antes do código.

rules:
  proposal:
    - Declarar explicitamente o que está fora do escopo
    - Identificar qual padrão de projeto será usado (Minimal API, Controllers, Blazor, MVC)
    - Identificar o banco de dados e a estratégia de acesso (EF Core, Dapper)
  specs:
    - Todo requisito precisa de ao menos um cenário testável
    - Cenários de erro e de borda são obrigatórios para fluxos críticos
  tasks:
    - Cada tarefa deve caber em uma sessão de trabalho
    - Cada tarefa deve informar como verificar a conclusão

operations:
  apply:
    guidance:
      - Regras de negócio devem ter teste unitário isolado
      - Endpoints devem ter teste de integração com WebApplicationFactory
      - Manter cobertura mínima de 80% nas camadas de domínio e serviço
  archive:
    guidance:
      - Rodar /opsx:verify antes de arquivar e resumir o resultado
      - Confirmar que a documentação Swagger está atualizada
