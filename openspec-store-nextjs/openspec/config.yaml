schema: spec-driven

context: |
  Language: pt-BR
  All artifacts must be written in pt-BR.
  Keep OpenSpec structural headings and SHALL/MUST keywords in English.

  Stack: Next.js 15 (App Router) + TypeScript strict.

  Opções de estilização (escolher uma por projeto):
  - Tailwind CSS
  - CSS Modules
  - Styled Components
  - Sass/SCSS

  Opções de componentes de UI (escolher uma por projeto):
  - shadcn/ui (requer Tailwind)
  - Radix UI primitives
  - Headless UI
  - Sem biblioteca de componentes (custom)

  Opções de banco de dados:
  - PostgreSQL via Prisma
  - PostgreSQL via Drizzle ORM
  - MySQL via Prisma
  - SQLite via Prisma (desenvolvimento local)
  - PlanetScale / Neon / Supabase (serverless)

  Opções de autenticação:
  - Auth.js (NextAuth v5)
  - Clerk
  - Supabase Auth
  - Custom JWT

  Opções de testes (escolher por projeto):
  - Vitest + Testing Library (unitário/integração)
  - Jest + Testing Library
  - Playwright (E2E)
  - Cypress (E2E)

  Opções de validação: Zod, Valibot, Yup.
  Opções de estado global: Zustand, Jotai, Redux Toolkit, Context API.
  Opções de data fetching: TanStack Query, SWR, Server Components nativos.
  Opções de jobs/filas: pg-boss, BullMQ, Inngest, Trigger.dev.

  Arquitetura: definir por projeto.
  Regras de negócio ficam nos serviços ou Server Actions, nunca em componentes.
  Entradas validadas com a biblioteca de validação escolhida.
  Código em inglês; textos de interface no idioma do produto.

  Git: trunk-based, PR obrigatório, Conventional Commits.
  Toda mudança de comportamento passa por /opsx:propose antes do código.

rules:
  proposal:
    - Declarar explicitamente o que está fora do escopo
    - Identificar as bibliotecas escolhidas para UI, banco, auth e testes
  specs:
    - Todo requisito precisa de ao menos um cenário testável
    - Cenários de erro e de borda são obrigatórios para fluxos críticos
  tasks:
    - Cada tarefa deve caber em uma sessão de trabalho
    - Cada tarefa deve informar como verificar a conclusão

operations:
  apply:
    guidance:
      - Regras de negócio devem ter teste unitário isolado
      - Manter cobertura mínima de 80% nos módulos de domínio críticos
  archive:
    guidance:
      - Rodar /opsx:verify antes de arquivar e resumir o resultado
