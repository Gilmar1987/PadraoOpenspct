name: Validate

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  # padrao-openspec/ é a fonte única de skills, comandos e agentes, sem stack embutida (ADR-0003).
  # Roda em Linux e em Windows: defeitos de caminho, console e Git aparecem só num dos dois.
  store:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: padrao-openspec
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # Nunca reinstala por cima: numa máquina com outra suíte rodando, a reinstalação tira o CLI do ar.
      - name: Instalar OpenSpec CLI
        run: |
          if [ "$(openspec --version 2>/dev/null)" = "1.14.2" ]; then
            echo "OpenSpec CLI 1.14.2 já instalado"
          else
            npm install --global @fission-ai/openspec@1.14.2
          fi

      - name: Validar specs e changes OpenSpec
        run: openspec validate --all --strict

      # validate --strict não falha quando config.yaml tem regras malformadas; o CLI só avisa
      # e descarta as regras do artefato. Gera as instruções de cada artefato com o config base,
      # falha em qualquer aviso e exige que todas as regras base apareçam nas instruções.
      - name: Config base carrega sem avisos
        run: |
          grep -E '^    - ' openspec/config.yaml | sed -E 's/^    - //; s/^"(.*)"$/\1/' > "$RUNNER_TEMP/base-rules.txt"
          status=0
          for config in openspec/config.yaml; do
            probe="$(mktemp -d)"
            cp -r openspec "$probe/"
            cp "$config" "$probe/openspec/config.yaml"
            mkdir -p "$probe/openspec/changes/ci-config-probe"
            output="$(cd "$probe" && for artifact in proposal specs design tasks; do
              openspec instructions "$artifact" --change ci-config-probe 2>&1
            done)"
            if grep -iE "ignoring|invalid '" <<< "$output"; then
              echo "::error file=padrao-openspec/$config::OpenSpec ignorou parte da configuração"
              status=1
            fi
            while IFS= read -r rule; do
              if ! grep -qF -- "$rule" <<< "$output"; then
                echo "::error file=padrao-openspec/$config::Regra do config base ausente: $rule"
                status=1
              fi
            done < "$RUNNER_TEMP/base-rules.txt"
          done
          exit $status

      - name: Lint de Markdown
        run: npx --yes markdownlint-cli2@0.23.2 "**/*.md"

      - name: Sintaxe dos scripts
        run: |
          node --check scripts/install-skills.mjs
          node --check scripts/setup-project.mjs
          node --check scripts/sync-root.mjs
          node --check scripts/changelog-range.mjs
          node --check scripts/comecar.mjs
          node --check scripts/portao.mjs
          node --check .claude/hooks/openspec-padrao/contexto-de-sessao.mjs
          node --check .claude/hooks/openspec-padrao/protege-ganchos.mjs
          node --check .claude/hooks/openspec-padrao/exige-change.mjs
          node --check scripts/validar-interface.mjs
          node --check scripts/lacunas.mjs
          node --check scripts/test-fixtures/interface/servidor.mjs
          # No Windows o Python se chama python e pode não ter o PyYAML.
          py="$(command -v python3 || command -v python)"
          if ! "$py" -c 'import yaml' 2>/dev/null; then
            # Ubuntu protege o Python do sistema (PEP 668); o fallback instala só para o usuário.
            "$py" -m pip install -q 'pyyaml==6.*' || "$py" -m pip install -q --user --break-system-packages 'pyyaml==6.*'
          fi
          "$py" -c 'import sys, yaml; yaml.safe_load(open(sys.argv[1], encoding="utf-8"))' templates/openspec-padrao-update.yml
          "$py" -c 'import sys, yaml; yaml.safe_load(open(sys.argv[1], encoding="utf-8"))' ../.github/workflows/release.yml

      # VERSION é a versão do padrão; a primeira seção do CHANGELOG da raiz tem de ser ela,
      # com "O que mudou" e "Ações no projeto" (ADR-0004).
      - name: Versão e changelog
        run: |
          v="$(tr -d '\r\n' < VERSION)"
          if ! grep -Eqx '[0-9]+\.[0-9]+\.[0-9]+' <<< "$v"; then
            echo "::error file=padrao-openspec/VERSION::VERSION não é semver: $v"; exit 1
          fi
          first="$(grep -m1 -E '^## [0-9]+\.[0-9]+\.[0-9]+' ../CHANGELOG.md | sed -E 's/^## ([0-9]+\.[0-9]+\.[0-9]+).*/\1/')"
          if [ "$first" != "$v" ]; then
            echo "::error file=CHANGELOG.md::A primeira versão do CHANGELOG ($first) difere de VERSION ($v)"; exit 1
          fi
          section="$(awk -v head="## $v" 'index($0, head) == 1 {f = 1; next} f && /^## / {exit} f' ../CHANGELOG.md)"
          for title in '### O que mudou' '### Ações no projeto'; do
            if ! grep -qxF "$title" <<< "$section"; then
              echo "::error file=CHANGELOG.md::A seção $v não tem \"$title\""; exit 1
            fi
          done

      - name: Smoke test do changelog-range
        run: |
          f="$RUNNER_TEMP/CHANGELOG.md"
          printf '# Changelog\n\n## 1.2.0 — 2026-11-01\n\n### O que mudou\n\n- c\n\n### Ações no projeto\n\n- Acrescentar X ao project.md\n\n## 1.1.0 — 2026-10-25\n\n### O que mudou\n\n- b\n\n### Ações no projeto\n\n- Nenhuma\n\n## 1.0.0 — 2026-10-20\n\n### O que mudou\n\n- a\n\n### Ações no projeto\n\n- Nenhuma\n' > "$f"
          out="$(node scripts/changelog-range.mjs --file "$f" --from 1.0.0 --to v1.2.0)"
          grep -q '^## 1\.2\.0' <<< "$out"
          grep -q '^## 1\.1\.0' <<< "$out"
          if grep -q '^## 1\.0\.0' <<< "$out"; then exit 1; fi
          acts="$(node scripts/changelog-range.mjs --file "$f" --from v1.0.0 --to 1.2.0 --actions)"
          grep -qF 'Acrescentar X ao project.md' <<< "$acts"
          if grep -q 'Nenhuma' <<< "$acts"; then exit 1; fi
          test -z "$(node scripts/changelog-range.mjs --file "$f" --from 1.2.0 --to 1.2.0)"
          if node scripts/changelog-range.mjs --file "$f" --from 1.0.0 --to 9.9.9; then exit 1; fi

      - name: Smoke test do registro de lacunas
        run: |
          # ADR-0007: registro em dia passa; linha sem motivo, fonte alterada e fonte ausente falham;
          # sem registro passa. O hash normaliza CRLF para LF.
          w="$(mktemp -d)"
          mkdir -p "$w/openspec/specs/a"
          printf 'regra A\r\n' > "$w/openspec/specs/a/spec.md"
          h="$(node -e 'const c = require("crypto"); const t = require("fs").readFileSync(process.argv[1], "utf8").replace(/\r\n/g, "\n"); console.log(c.createHash("sha256").update(t).digest("hex"))' "$w/openspec/specs/a/spec.md")"
          reg() { cp openspec/lacunas.md "$w/openspec/lacunas.md"; printf '%s\n' "$1" >> "$w/openspec/lacunas.md"; }
          node scripts/lacunas.mjs --raiz . | grep -qF 'ok: 0 lacunas'
          reg "| L-001 | openspec/specs/a/spec.md | $h | Item | Motivo | 2026-10-22 | change x |"
          node scripts/lacunas.mjs --raiz "$w" | grep -qF 'ok: 1 lacuna, 1 fonte'
          reg "| L-001 | openspec/specs/a/spec.md | $h | Item | Motivo | 2026-02-30 | change x |"
          if node scripts/lacunas.mjs --raiz "$w" > "$RUNNER_TEMP/lacunas0.txt"; then exit 1; fi
          grep -qF 'data AAAA-MM-DD válida' "$RUNNER_TEMP/lacunas0.txt"
          reg "| L-001 | openspec/specs/a/spec.md | $h | Item |  | 2026-10-22 | change x |"
          if node scripts/lacunas.mjs --raiz "$w" > "$RUNNER_TEMP/lacunas1.txt"; then exit 1; fi
          grep -qF 'falta o motivo' "$RUNNER_TEMP/lacunas1.txt"
          reg "| L-001 | openspec/specs/a/spec.md | $h | Item | Motivo | 2026-10-22 | change x |"
          printf 'regra A mudou\n' > "$w/openspec/specs/a/spec.md"
          if node scripts/lacunas.mjs --raiz "$w" > "$RUNNER_TEMP/lacunas2.txt"; then exit 1; fi
          grep -qF 'releia a declaração inteira' "$RUNNER_TEMP/lacunas2.txt"
          reg "| L-001 | openspec/specs/b/spec.md | $h | Item | Motivo | 2026-10-22 | change x |"
          if node scripts/lacunas.mjs --raiz "$w" > "$RUNNER_TEMP/lacunas3.txt"; then exit 1; fi
          grep -qF 'fonte ausente' "$RUNNER_TEMP/lacunas3.txt"
          reg "| L-001 | codigo:src/a.txt | $h | Item | Motivo | 2026-10-22 | change x |"
          if node scripts/lacunas.mjs --raiz "$w" > "$RUNNER_TEMP/lacunas4.txt"; then exit 1; fi
          grep -qF 'informe --codigo' "$RUNNER_TEMP/lacunas4.txt"
          mkdir -p "$w/code/src"
          printf 'regra A\n' > "$w/code/src/a.txt"
          node scripts/lacunas.mjs --raiz "$w" --codigo "$w/code" | grep -qF 'ok: 1 lacuna, 1 fonte'
          set +e; node scripts/lacunas.mjs --raiz "$w/code" > "$RUNNER_TEMP/lacunas5.txt" 2>&1; status=$?; set -e
          test "$status" -eq 2
          grep -qF 'raiz sem openspec/' "$RUNNER_TEMP/lacunas5.txt"
          rm "$w/openspec/lacunas.md"
          node scripts/lacunas.mjs --raiz "$w" | grep -qF 'sem registro de lacunas'
          rm -rf "$w"

      # Skills e comandos gerados pelo OpenSpec CLI levam trechos customizados do padrão;
      # regenerá-los apaga esses trechos. A checagem falha se algum deles sumir.
      - name: Trechos customizados das skills
        run: |
          missing=0
          check() {
            if ! grep -qF -- "$2" "$1"; then
              echo "::error file=padrao-openspec/$1::Trecho customizado ausente: $2"
              missing=1
            fi
          }
          for f in .claude/commands/opsx/propose.md .claude/skills/openspec-propose/SKILL.md; do
            check "$f" "Architectural Decision Check"
            check "$f" "Prior authorization exception"
            check "$f" "Approval content seal"
            check "$f" "Declared inference"
            check "$f" "Standard version check"
            check "$f" "offer to update now"
            check "$f" "Commit the planning"
            check "$f" "Interface contract first"
            check "$f" "Related debts"
            check "$f" "verificacao"
            check "$f" "Check concurrent changes"
            check "$f" "Interface brief"
            check "$f" "Impacto medido"
            check "$f" "Falhas aceitas:"
            check "$f" "seen failing"
          done
          for f in .claude/commands/opsx/apply.md .claude/skills/openspec-apply-change/SKILL.md; do
            check "$f" "Check the approval record"
            check "$f" "Approval content seal"
            check "$f" "OpenSpec-Change:"
            check "$f" "Confirm progress per task group"
            check "$f" "Standard version check"
            check "$f" "offer to update now"
            check "$f" "Record task evidence"
            check "$f" "Push only on explicit request"
            check "$f" "Security checks"
            check "$f" "Request code review"
            check "$f" "Contract and code in the same commit"
            check "$f" "Run the gate"
            check "$f" "Unrequested fixes are scope"
            check "$f" "Check the library API"
            check "$f" "Revalidate requirements after a version change"
            check "$f" "Tool generators outside the repository"
            check "$f" "Simulate CI on a clean copy"
            check "$f" "Production-mode check"
          done
          for f in .claude/commands/opsx/verify.md .claude/skills/openspec-verify-change/SKILL.md; do
            check "$f" "Write the verification record"
            check "$f" "Evidence reuse"
            check "$f" "Standard version check"
            check "$f" "offer to update now"
            check "$f" "Cobertura fora da suíte"
            check "$f" "Project validation commands"
            check "$f" "Code review record"
            check "$f" "External report triage"
            check "$f" "Review before verify"
            check "$f" "Dependencies in Impact"
            check "$f" "Agent-run browser scripts"
            check "$f" "Interface quality gate"
            check "$f" "Screens without visual brief"
            check "$f" "Declared gaps"
            check "$f" "ADR verification"
            check "$f" "Interface contract check"
            check "$f" "Verification layers"
            check "$f" "Engineering principles"
            check "$f" "   - Camadas: <layer (command)"
            check "$f" "ADR check seen failing"
            check "$f" "nada a varrer"
            check "$f" "Accepted failures"
            check "$f" "Exit conditions"
          done
          # Subagentes do Claude Code (subagentes-e-ganchos): a revisão de código usa o revisor somente leitura.
          check .claude/skills/requesting-code-review/SKILL.md "openspec-code-reviewer"
          for f in .claude/commands/opsx/archive.md .claude/skills/openspec-archive-change/SKILL.md; do
            check "$f" "Update the project overview"
            check "$f" "Update the open debts"
            check "$f" "add it to both pathspecs"
            check "$f" "Standard version check"
            check "$f" "offer to update now"
            check "$f" "Check the archive authorization"
            check "$f" "Approval content seal"
            check "$f" "Commit the archive"
            check "$f" "Run the gate"
            check "$f" "Falhas aceitas:"
          done
          for f in .claude/commands/opsx/update.md .claude/skills/openspec-update-change/SKILL.md; do
            check "$f" "Scope change resets approval"
            check "$f" "Approval content seal"
          done
          # Entrevista do init: documento de arquitetura, idioma do código, fila por banco e E2E acrescentado.
          f=.claude/commands/opsx/init.md
          check "$f" "Commit the init"
          check "$f" "[INFERIDO: <base>]"
          check "$f" "| Validação de interface |"
          check "$f" "seguir a skill interface-quality"
          check "$f" '### Arquivo 5: `<root>/openspec/arquitetura.md`'
          check "$f" "flowchart LR"
          check "$f" "ou de Development Conventions"
          check "$f" "3.8 cita uma biblioteca presa"
          check "$f" "**7.3 — Em que idioma o código será escrito"
          check "$f" "Fila no próprio banco"
          check "$f" 'acrescente ao `operations.apply.guidance`'
          check "$f" "**2.6 — O sistema expõe ou consome uma API"
          # Débitos e camadas (debitos-e-camadas-de-verificacao): Arquivo 6 e matriz no init; trecho no explore.
          check "$f" '### Arquivo 6: `<root>/openspec/estado-atual.md`'
          # Princípios de engenharia (principios-de-engenharia): 7.4 no init, revisão, regras e modelo de project.md.
          check "$f" "**7.4 — Princípios de engenharia"
          check .claude/skills/requesting-code-review/code-reviewer.md "Engineering principles"
          check .claude/agents/openspec-code-reviewer.md "Engineering principles"
          check openspec/rules.md "Princípios de engenharia"
          check openspec/project.md "**Princípios de engenharia:**"
          check "$f" 'Preencha a seção "Camadas de verificação"'
          check openspec/project.md "## Camadas de verificação"
          for g in .claude/commands/opsx/explore.md .claude/skills/openspec-explore/SKILL.md; do
            check "$g" "Related debts"
          done
          # Imposição e catraca (imposicao-e-catraca): Falhas aceitas e "Sai quando" conferível no Arquivo 6, modelo de ADR e config.
          check "$f" "## Falhas aceitas"
          check "$f" "Uma data sozinha não é condição"
          check openspec/adrs/template.md "imposicao:"
          check openspec/adrs/template.md "## Limite"
          check openspec/adrs/README.md "`imposicao`"
          check openspec/config.yaml "Impacto medido"
          # Contratos de interface (contratos-de-interface): template do project.md e regra global.
          check openspec/project.md "### Contratos de interface"
          check openspec/project.md "| Teste de contrato |"
          check openspec/rules.md "contrato de interface (seção"
          # Coerência de segurança (1.7.0): opção sem autenticação, combinações novas e a restrição no project.md.
          check "$f" "0) Sem autenticação no MVP"
          check "$f" '7.1 "Auditoria de dependências" é "Não aplicável"'
          check "$f" '7.1 "Varredura de secrets" é "Não aplicável"'
          check "$f" '3.6 é "0) Sem autenticação no MVP" (ou um "Outro" equivalente)'
          check "$f" "leve a restrição de uso"
          exit $missing

      - name: Paridade de papéis
        run: |
          # Cada agente do Copilot tem um subagente do Claude Code (ADR-0006). Os papéis de veredito
          # não têm Edit nem Write.
          missing=0
          declare -A alias=([business-requirements-ingestor]=requirements-ingestor)
          only_claude=" stage-reviewer code-reviewer requirements-ingestor "
          for f in .github/agents/*.agent.md; do
            role=$(basename "$f" .agent.md)
            role=${alias[$role]:-$role}
            if [ ! -f ".claude/agents/openspec-$role.md" ]; then
              echo "::error file=padrao-openspec/$f::Falta o subagente .claude/agents/openspec-$role.md"
              missing=1
            fi
          done
          found=0
          for f in .claude/agents/openspec-*.md; do
            [ -f "$f" ] || continue
            found=1
            role=$(basename "$f" .md)
            role=${role#openspec-}
            case "$only_claude" in *" $role "*) ;; *)
              if [ ! -f ".github/agents/$role.agent.md" ]; then
                echo "::error file=padrao-openspec/$f::Papel sem agente do Copilot e fora das exceções: $role"
                missing=1
              fi ;;
            esac
            if [ "$role" != code-implementer ] && grep -E '^tools:' "$f" | grep -qE '(^|[^A-Za-z])(Edit|Write)([^A-Za-z]|$)'; then
              echo "::error file=padrao-openspec/$f::Papel de veredito com Edit ou Write"
              missing=1
            fi
          done
          if [ "$found" = 0 ]; then
            echo "::error::Nenhum subagente em .claude/agents/"
            missing=1
          fi
          exit $missing

      - name: Smoke test dos hooks do Claude Code
        run: |
          # Cada hook recebe um payload JSON simulado no stdin (ADR-0006). "deny"/"ask" na saída
          # nega ou pede confirmação; saída vazia libera.
          h=.claude/hooks/openspec-padrao
          for f in "$h"/*.mjs; do node --check "$f"; done
          fail=0
          payload() { node -e 'const [tool, key, value, cwd, agent] = process.argv.slice(1); const p = { tool_name: tool, tool_input: { [key]: value } }; if (cwd) p.cwd = cwd; if (agent) p.agent_type = agent; process.stdout.write(JSON.stringify(p));' "$@"; }
          expect() {
            local want="$1" hook="$2" json="$3" out
            out=$(printf '%s' "$json" | node "$h/$hook")
            case "$want" in
              allow) [ -z "$out" ] || { echo "::error::$hook deveria liberar: $json -> $out"; fail=1; } ;;
              *) case "$out" in *"\"$want\""*) ;; *) echo "::error::$hook deveria responder $want: $json -> $out"; fail=1 ;; esac ;;
            esac
          }
          # somente-leitura.mjs
          for cmd in 'echo x > a.txt' 'git push origin main' 'python -c "print(1)"' 'Set-Content a.txt x' \
                     'npm test && rm -rf dist' 'sed -i s/a/b/ f.txt' 'git -C . commit -m x' 'cat a | tee b' \
                     'cp a b' 'mkdir -p out' 'git pull' 'git branch -D feat' 'sed --in-place s/a/b/ f' \
                     '(rm -rf x)' 'del x' 'env rm x' 'find . -delete' 'git config user.name x' \
                     'for f in *.tmp; do rm "$f"; done' 'if true; then rm x; fi' 'f() { rm x; }; f' '! rm x' \
                     'xargs rm < lista' 'echo $(rm x)' 'Get-ChildItem | ForEach-Object { Remove-Item $_ }'; do
            expect deny somente-leitura.mjs "$(payload Bash command "$cmd" '' openspec-qa-validator)"
          done
          for cmd in 'git status' 'npm test' 'grep -rn "a > b" src' 'npm test 2>&1 | tail -5' \
                     'ls > /dev/null' 'git diff HEAD~1' 'openspec validate --all --strict' 'Get-Content a.txt' \
                     'python -m pytest -p no:cacheprovider' 'node -r ts-node/register x.ts' 'git stash list' \
                     'git tag -l' 'echo x > /dev/stderr' 'git config --get user.name' 'npx playwright test' \
                     'echo ${HOME}' 'git show stash@{0}' 'git tag --contains HEAD@{1}'; do
            expect allow somente-leitura.mjs "$(payload Bash command "$cmd" '' openspec-stage-reviewer)"
          done
          # Agente principal (sem agent_type) e outro subagente: o hook de papel não interfere.
          expect allow somente-leitura.mjs "$(payload Bash command 'echo x > a.txt')"
          expect allow somente-leitura.mjs "$(payload Bash command 'git push origin main' '' openspec-code-implementer)"
          expect deny somente-leitura.mjs "$(payload PowerShell command 'Set-Content a.txt x' '' openspec-code-reviewer)"
          expect allow somente-leitura.mjs 'isto não é JSON'
          # Validador de interface (qualidade-de-interface): roda o script de validação, não grava arquivo.
          expect deny somente-leitura.mjs "$(payload Bash command 'echo x > a.txt' '' openspec-validador-de-interface)"
          expect deny somente-leitura.mjs "$(payload Bash command 'rm -rf interface' '' openspec-validador-de-interface)"
          expect allow somente-leitura.mjs "$(payload Bash command 'node docs/openspec-validar-interface.mjs http://localhost:3000 --jornadas interface/jornadas.json' '' openspec-validador-de-interface)"
          # escopo-de-escrita.mjs, num repositório temporário
          repo=$(mktemp -d)
          git -C "$repo" init -q
          repo_native=$(cygpath -m "$repo" 2>/dev/null || echo "$repo")
          for target in .claude/settings.json docs/openspec-regras.md .openspec-padrao.json ../fora.txt .github/agents/x.agent.md; do
            expect deny escopo-de-escrita.mjs "$(payload Write file_path "$target" "$repo_native" openspec-code-implementer)"
          done
          for target in src/app.ts 'src\app.ts' "$repo_native/README.md" docs/guia.md; do
            expect allow escopo-de-escrita.mjs "$(payload Write file_path "$target" "$repo_native" openspec-code-implementer)"
          done
          # Agente principal (sem agent_type): o hook de papel não interfere.
          expect allow escopo-de-escrita.mjs "$(payload Write file_path .claude/settings.json "$repo_native")"
          rm -rf "$repo"
          # cobra-evidencia.mjs, numa raiz OpenSpec local temporária (sem registrar store)
          w=$(mktemp -d)
          git -C "$w" init -q
          mkdir -p "$w/openspec/changes/demo" "$w/openspec/specs"
          printf 'schema: spec-driven\n' > "$w/openspec/config.yaml"
          printf '# Proposal\n\n## Why\n\nTeste.\n' > "$w/openspec/changes/demo/proposal.md"
          printf '## 1. A\n\n- [x] 1.1 primeira\n  - Evidência: `x` → ok (exit 0)\n- [x] 1.2 segunda sem prova\n- [ ] 1.3 terceira\n' > "$w/openspec/changes/demo/tasks.md"
          w_native=$(cygpath -m "$w" 2>/dev/null || echo "$w")
          stop() { node -e 'const [cwd, active] = process.argv.slice(1); process.stdout.write(JSON.stringify({ hook_event_name: "Stop", cwd, stop_hook_active: active === "1" }));' "$w_native" "$1"; }
          expect block cobra-evidencia.mjs "$(stop 0)"
          out=$(printf '%s' "$(stop 0)" | node "$h/cobra-evidencia.mjs")
          case "$out" in *"1.2 segunda"*) ;; *) echo "::error::cobra-evidencia deveria citar a tarefa 1.2: $out"; fail=1 ;; esac
          case "$out" in *"1.1 primeira"*) echo "::error::cobra-evidencia citou a tarefa com evidência: $out"; fail=1 ;; esac
          expect allow cobra-evidencia.mjs "$(stop 1)"
          printf '## 1. A\n\n- [x] 1.1 primeira\n  - Evidência: `x` → ok (exit 0)\n- [ ] 1.2 segunda\n' > "$w/openspec/changes/demo/tasks.md"
          expect allow cobra-evidencia.mjs "$(stop 0)"
          # Todas as tarefas marcadas (status "complete" no CLI) continuam sendo cobradas.
          printf '## 1. A\n\n- [x] 1.1 primeira\n- [x] 1.2 segunda\n' > "$w/openspec/changes/demo/tasks.md"
          expect block cobra-evidencia.mjs "$(stop 0)"
          # Com o transcript da conversa, um tasks.md anterior a ela não bloqueia; um alterado depois, sim.
          transcript="$w_native/transcript.jsonl"
          node -e 'require("fs").writeFileSync(process.argv[1], JSON.stringify({ timestamp: new Date().toISOString() }) + "\n")' "$transcript"
          node -e 'const t = new Date(Date.now() - 3600e3); require("fs").utimesSync(process.argv[1], t, t)' "$w_native/openspec/changes/demo/tasks.md"
          stop_t() { node -e 'const [cwd, transcript_path] = process.argv.slice(1); process.stdout.write(JSON.stringify({ hook_event_name: "Stop", cwd, transcript_path, stop_hook_active: false }));' "$w_native" "$transcript"; }
          expect allow cobra-evidencia.mjs "$(stop_t)"
          printf '## 1. A\n\n- [x] 1.1 primeira\n- [x] 1.2 segunda\n' > "$w/openspec/changes/demo/tasks.md"
          expect block cobra-evidencia.mjs "$(stop_t)"
          # portao-do-archive.mjs: sem portão pede confirmação; com portão, segue o código de saída dele.
          bash_in() { node -e 'const [command, cwd] = process.argv.slice(1); process.stdout.write(JSON.stringify({ tool_name: "Bash", cwd, tool_input: { command } }));' "$1" "$w_native"; }
          expect ask portao-do-archive.mjs "$(bash_in 'openspec archive demo --yes')"
          expect allow portao-do-archive.mjs "$(bash_in 'git status')"
          mkdir -p "$w/docs"
          printf 'console.log(JSON.stringify({ ok: false, acao: "archive", change: process.argv[3], motivos: ["verification.md ausente"] })); process.exit(1);\n' > "$w/docs/openspec-portao.mjs"
          expect deny portao-do-archive.mjs "$(bash_in 'openspec archive demo --yes')"
          out=$(printf '%s' "$(bash_in 'openspec archive demo')" | node "$h/portao-do-archive.mjs")
          case "$out" in *"verification.md ausente"*) ;; *) echo "::error::portao-do-archive deveria mostrar os motivos: $out"; fail=1 ;; esac
          printf 'console.log(JSON.stringify({ ok: true, acao: "archive", change: process.argv[3], motivos: [] }));\n' > "$w/docs/openspec-portao.mjs"
          expect allow portao-do-archive.mjs "$(bash_in 'openspec archive demo --yes')"
          expect deny portao-do-archive.mjs "$(bash_in 'openspec archive nome%invalido')"
          printf 'console.log(JSON.stringify({ ok: false, motivos: [process.argv.slice(2).join(" ")] })); process.exit(1);\n' > "$w/docs/openspec-portao.mjs"
          out=$(printf '%s' "$(bash_in 'openspec --no-color archive "demo" --store=meu-store -y')" | node "$h/portao-do-archive.mjs")
          case "$out" in *'archive demo --json --store meu-store'*) ;; *) echo "::error::portao-do-archive deveria repassar change e --store=: $out"; fail=1 ;; esac
          # protege-ganchos.mjs (ganchos-de-sessao-e-fluxo): vale para todos os agentes.
          for cmd in 'git commit --no-verify -m x' 'git commit -nm x' 'git commit -an -m x' 'git push --no-verify' \
                     'git -c core.hooksPath=/dev/null commit -m x' 'git config core.hooksPath x' \
                     'git config --unset core.hooksPath' 'git config --global core.hooksPath x' \
                     'git config set core.hooksPath x' 'git config unset core.hooksPath' \
                     'git config -f .git/config core.hooksPath x' 'git --config-env core.hooksPath=V commit' \
                     'git commit --no-verif -m x' 'HUSKY=0 git commit --no-verify' 'env git commit -n' \
                     'GIT_CONFIG_KEY_0=core.hooksPath git commit'; do
            expect deny protege-ganchos.mjs "$(payload Bash command "$cmd")"
          done
          expect deny protege-ganchos.mjs "$(payload PowerShell command 'git commit --no-verify -m x' '' openspec-code-implementer)"
          for cmd in 'git log -n 5' 'git config --get core.hooksPath' 'git commit -m "sem --no-verify aqui"' 'git status' \
                     'echo git commit --no-verify' 'git config core.hooksPath' 'git config get core.hooksPath' \
                     'git commit -uno -m x' 'git commit -m -n' 'git commit --amend --no-edit'; do
            expect allow protege-ganchos.mjs "$(payload Bash command "$cmd")"
          done
          # exige-change.mjs e contexto-de-sessao.mjs, com um portão falso que responde ao "estado".
          w=$(mktemp -d)
          git -C "$w" init -q
          mkdir -p "$w/docs" "$w/src"
          w_native=$(cygpath -m "$w" 2>/dev/null || echo "$w")
          estado() { printf 'console.log(JSON.stringify({ ok: true, acao: "estado", changes: %s }));\n' "$1" > "$w/docs/openspec-portao.mjs"; }
          write_in() { node -e 'const [file_path, cwd, session_id] = process.argv.slice(1); const p = { tool_name: "Write", cwd, tool_input: { file_path } }; if (session_id) p.session_id = session_id; process.stdout.write(JSON.stringify(p));' "$1" "$w_native" "$2"; }
          aprovada='[{ "change": "demo", "tarefas": { "feitas": 3, "total": 7 }, "aprovacao": "apply", "selo": "valido", "inferencias": 0, "proximo": "/opsx:apply" }]'
          pendente='[{ "change": "demo", "tarefas": { "feitas": 0, "total": 7 }, "aprovacao": "pendente", "selo": "ausente", "inferencias": 0, "proximo": "pedir a aprovação ao responsável" }]'
          estado "$pendente"
          expect ask exige-change.mjs "$(write_in src/app.ts)"
          expect allow exige-change.mjs "$(write_in openspec/changes/nova/proposal.md)"
          expect allow exige-change.mjs "$(write_in ../fora.txt)"
          estado "$aprovada"
          sid="ci-$$-$RANDOM"
          expect allow exige-change.mjs "$(write_in src/app.ts "$sid")"
          # A resposta positiva fica em cache na sessão; a negativa nunca.
          estado "$pendente"
          expect allow exige-change.mjs "$(write_in src/app.ts "$sid")"
          expect ask exige-change.mjs "$(write_in src/app.ts)"
          vencida='[{ "change": "demo", "tarefas": { "feitas": 3, "total": 7 }, "aprovacao": "apply", "selo": "vencido", "inferencias": 0, "proximo": "reconfirmar" }]'
          estado "$vencida"
          expect ask exige-change.mjs "$(write_in src/app.ts)"
          session() { node -e 'process.stdout.write(JSON.stringify({ hook_event_name: "SessionStart", source: "startup", cwd: process.argv[1] }))' "$w_native"; }
          estado "$aprovada"
          out=$(printf '%s' "$(session)" | node "$h/contexto-de-sessao.mjs")
          case "$out" in *additionalContext*demo*3/7*'/opsx:apply'*) ;; *) echo "::error::contexto-de-sessao deveria resumir o estado: $out"; fail=1 ;; esac
          estado '[]'
          out=$(printf '%s' "$(session)" | node "$h/contexto-de-sessao.mjs")
          case "$out" in *'/opsx:propose'*) ;; *) echo "::error::contexto-de-sessao sem changes deveria sugerir o propose: $out"; fail=1 ;; esac
          # Sem portão, nenhum dos dois interfere.
          rm "$w/docs/openspec-portao.mjs"
          expect allow exige-change.mjs "$(write_in src/app.ts)"
          expect allow contexto-de-sessao.mjs "$(session)"
          rm -rf "$w"
          exit $fail

      - name: Smoke test do instalador
        run: |
          consumer="$(mktemp -d)"
          git -C "$consumer" init -q
          node scripts/install-skills.mjs "$consumer" --target both
          # O conteúdo local de openspec/ fica ignorado; a declaração do store (config.yaml) vai para o git.
          git -C "$consumer" check-ignore -q openspec/changes/demo/proposal.md
          if git -C "$consumer" check-ignore -q openspec/config.yaml; then exit 1; fi
          test ! -e "$consumer/.agents/skills/dotnet-implementation"
          test ! -e "$consumer/.agents/skills/nextjs-implementation"
          node scripts/install-skills.mjs "$consumer" --target both | grep -q '^Done\. 0 installed'
          test "$(grep -cx '/openspec/\*' "$consumer/.gitignore")" -eq 1
          test "$(grep -cx '!/openspec/config.yaml' "$consumer/.gitignore")" -eq 1
          # Migração do bloco antigo, que ignorava /openspec/ inteiro.
          legacy="$(mktemp -d)"
          git -C "$legacy" init -q
          printf 'node_modules/\n# OpenSpec planning artifacts are maintained in the separate planning store.\n/openspec/\n' > "$legacy/.gitignore"
          node scripts/install-skills.mjs "$legacy" --target agents
          test "$(grep -cx '/openspec/' "$legacy/.gitignore")" -eq 0
          test "$(grep -cx '/openspec/\*' "$legacy/.gitignore")" -eq 1
          grep -qx 'node_modules/' "$legacy/.gitignore"
          if git -C "$legacy" check-ignore -q openspec/config.yaml; then exit 1; fi
          # --stack foi removido (ADR-0003): recusado antes de qualquer cópia.
          stackless="$(mktemp -d)"
          git -C "$stackless" init -q
          if node scripts/install-skills.mjs "$stackless" --stack dotnet 2> "$RUNNER_TEMP/stack-err.txt"; then exit 1; fi
          grep -qF -- '--stack was removed' "$RUNNER_TEMP/stack-err.txt"
          test ! -e "$stackless/.agents"
          test ! -e "$stackless/.claude"
          test ! -e "$stackless/.gitignore"
          # Comandos OPSX instalados idênticos à fonte, incluindo init e ingest.
          diff -r .claude/commands/opsx "$consumer/.claude/commands/opsx"
          test -f "$consumer/.claude/commands/opsx/init.md"
          test -f "$consumer/.claude/commands/opsx/ingest.md"
          grep -q 'Architectural Decision Check' "$consumer/.claude/commands/opsx/propose.md"
          for skill in docker requesting-code-review versioning-ci-cd interface-quality; do
            test -f "$consumer/.agents/skills/$skill/SKILL.md"
          done
          # Comando customizado no consumidor: sem --force nada é copiado.
          echo customizado >> "$consumer/.claude/commands/opsx/propose.md"
          if node scripts/install-skills.mjs "$consumer"; then exit 1; fi
          grep -q '^customizado$' "$consumer/.claude/commands/opsx/propose.md"
          # Sem --target, as skills vão para .agents/skills e .claude/skills.
          default="$(mktemp -d)"
          git -C "$default" init -q
          node scripts/install-skills.mjs "$default"
          test -f "$default/.agents/skills/openspec-propose/SKILL.md"
          test -f "$default/.claude/skills/openspec-propose/SKILL.md"
          cmp .claude/skills/openspec-propose/SKILL.md "$default/.claude/skills/openspec-propose/SKILL.md"
          # --target agents não cria .claude/skills, mas instala os comandos.
          agents_only="$(mktemp -d)"
          git -C "$agents_only" init -q
          node scripts/install-skills.mjs "$agents_only" --target agents
          test ! -e "$agents_only/.claude/skills"
          test -f "$agents_only/.claude/commands/opsx/init.md"
          # Nenhuma skill externa é recomendada nem instalada.
          rec_none="$(mktemp -d)"
          git -C "$rec_none" init -q
          node scripts/install-skills.mjs "$rec_none" > "$RUNNER_TEMP/rec-none.txt"
          if grep -q 'npx skills add' "$RUNNER_TEMP/rec-none.txt"; then exit 1; fi
          # Manifesto, workflow e guia de atualização chegam na primeira instalação (ADR-0004).
          man="$(mktemp -d)"
          git -C "$man" init -q -b main
          node scripts/install-skills.mjs "$man" > /dev/null
          test -f "$man/.github/workflows/openspec-padrao-update.yml"
          test -f "$man/docs/openspec-padrao.md"
          node -e '
            const m = JSON.parse(require("fs").readFileSync(process.argv[1] + "/.openspec-padrao.json", "utf8"));
            const v = require("fs").readFileSync("VERSION", "utf8").trim();
            const need = [".claude/commands/opsx/apply.md", ".github/workflows/openspec-padrao-update.yml", "docs/openspec-padrao.md"];
            if (m.version !== v || m.target !== "both" || !need.every((f) => m.managedFiles.includes(f))) process.exit(1);
          ' "$man"
          # Reinstalação sem mudança passa sem modo.
          node scripts/install-skills.mjs "$man" | grep -q '^Done\. 0 installed'
          git -C "$man" add -A
          git -C "$man" -c user.name=ci -c user.email=ci@example.invalid commit -qm base
          # Arquivo extra numa pasta de skill não conta como mudança.
          printf 'extra\n' > "$man/.claude/skills/openspec-propose/extra.md"
          git -C "$man" add -A
          git -C "$man" -c user.name=ci -c user.email=ci@example.invalid commit -qm extra
          node scripts/install-skills.mjs "$man" | grep -q '^Done\. 0 installed'
          test -z "$(git -C "$man" status --porcelain)"
          # Versão nova da fonte (cópia com um comando alterado): sem modo, recusa sem mudar nada.
          src="$(mktemp -d)/padrao-openspec"
          cp -r . "$src"
          printf '1.0.1\n' > "$src/VERSION"
          printf '\nlinha nova\n' >> "$src/.claude/commands/opsx/apply.md"
          if node "$src/scripts/install-skills.mjs" "$man" 2> "$RUNNER_TEMP/mode-err.txt"; then exit 1; fi
          grep -qF -- '--update' "$RUNNER_TEMP/mode-err.txt"
          grep -qF -- '--in-place' "$RUNNER_TEMP/mode-err.txt"
          test -z "$(git -C "$man" status --porcelain)"
          # --update com alteração pendente: recusa sem mudar nada.
          printf 'pendente\n' > "$man/rascunho.txt"
          if node "$src/scripts/install-skills.mjs" "$man" --update; then exit 1; fi
          test "$(git -C "$man" branch --show-current)" = main
          if grep -q 'linha nova' "$man/.claude/commands/opsx/apply.md"; then exit 1; fi
          rm "$man/rascunho.txt"
          # --update limpo: branch própria com um commit; a main não muda.
          before="$(git -C "$man" rev-parse main)"
          GIT_AUTHOR_NAME=ci GIT_AUTHOR_EMAIL=ci@example.invalid GIT_COMMITTER_NAME=ci GIT_COMMITTER_EMAIL=ci@example.invalid \
            node "$src/scripts/install-skills.mjs" "$man" --update
          test "$(git -C "$man" branch --show-current)" = chore/padrao-v1.0.1
          test "$(git -C "$man" rev-parse main)" = "$before"
          test -z "$(git -C "$man" status --porcelain)"
          git -C "$man" log -1 --format=%s | grep -qx 'chore: atualiza padrão OpenSpec para v1.0.1'
          grep -q 'linha nova' "$man/.claude/commands/opsx/apply.md"
          node -e 'process.exit(JSON.parse(require("fs").readFileSync(process.argv[1] + "/.openspec-padrao.json", "utf8")).version === "1.0.1" ? 0 : 1)' "$man"
          # Falha no meio do --update (hook de pre-commit): volta à branch original, sem branch nova nem sujeira.
          tx="$(mktemp -d)"
          git -C "$tx" init -q -b main
          node scripts/install-skills.mjs "$tx" > /dev/null
          git -C "$tx" add -A
          git -C "$tx" -c user.name=ci -c user.email=ci@example.invalid commit -qm base
          printf '#!/bin/sh\nexit 1\n' > "$tx/.git/hooks/pre-commit"
          chmod +x "$tx/.git/hooks/pre-commit"
          if GIT_AUTHOR_NAME=ci GIT_AUTHOR_EMAIL=ci@example.invalid GIT_COMMITTER_NAME=ci GIT_COMMITTER_EMAIL=ci@example.invalid \
            node "$src/scripts/install-skills.mjs" "$tx" --update; then exit 1; fi
          test "$(git -C "$tx" branch --show-current)" = main
          if git -C "$tx" rev-parse --verify --quiet refs/heads/chore/padrao-v1.0.1; then exit 1; fi
          test -z "$(git -C "$tx" status --porcelain)"
          rm "$tx/.git/hooks/pre-commit"
          # Só a versão mudou: regravar o manifesto também exige modo.
          src_v="$(mktemp -d)/padrao-openspec"
          cp -r . "$src_v"
          printf '1.0.2\n' > "$src_v/VERSION"
          if node "$src_v/scripts/install-skills.mjs" "$tx"; then exit 1; fi
          test -z "$(git -C "$tx" status --porcelain)"
          # --in-place grava na branch atual, sem commit.
          node "$src/scripts/install-skills.mjs" "$tx" --in-place > /dev/null
          test "$(git -C "$tx" branch --show-current)" = main
          grep -q 'linha nova' "$tx/.claude/commands/opsx/apply.md"
          test -n "$(git -C "$tx" status --porcelain)"
          node -e 'process.exit(JSON.parse(require("fs").readFileSync(process.argv[1] + "/.openspec-padrao.json", "utf8")).version === "1.0.1" ? 0 : 1)' "$tx"

      - name: Smoke test da camada do Claude Code no instalador
        run: |
          # ADR-0006: subagentes e hooks como arquivos gerenciados; no .claude/settings.json, só as
          # entradas do padrão mudam, um JSON inválido para tudo, e o prefixo openspec- é reservado.
          export GIT_AUTHOR_NAME=ci GIT_AUTHOR_EMAIL=ci@example.invalid GIT_COMMITTER_NAME=ci GIT_COMMITTER_EMAIL=ci@example.invalid
          p="$(mktemp -d)"
          git -C "$p" init -q
          mkdir -p "$p/.claude"
          printf '{\n  "permissions": { "allow": ["Bash(npm test)"], "ask": ["Bash(git push *)"] },\n  "hooks": { "PreToolUse": [ { "matcher": "Edit", "hooks": [ { "type": "command", "command": "echo projeto" } ] } ] }\n}\n' > "$p/.claude/settings.json"
          node scripts/install-skills.mjs "$p" > /dev/null
          for f in .claude/agents/*.md .claude/hooks/openspec-padrao/*.mjs; do cmp "$f" "$p/$f"; done
          s="$p/.claude/settings.json"
          node -e '
            const s = JSON.parse(require("fs").readFileSync(process.argv[1], "utf8"));
            const has = (list, rule) => (s.permissions[list] || []).includes(rule);
            const hooks = JSON.stringify(s.hooks);
            const ok = has("allow", "Bash(npm test)") && has("ask", "Bash(git push *)") && has("ask", "Bash(openspec archive *)")
              && has("deny", "Bash(git reset --hard *)") && hooks.includes("echo projeto")
              && hooks.includes("cobra-evidencia.mjs") && hooks.includes("portao-do-archive.mjs")
              && hooks.includes("somente-leitura.mjs") && hooks.includes("escopo-de-escrita.mjs");
            // Cada script do padrão no matcher certo: um hook de papel no grupo errado nunca agiria.
            const where = (script) => (s.hooks.PreToolUse || []).filter((g) => JSON.stringify(g.hooks).includes(script)).map((g) => g.matcher);
            const placed = JSON.stringify(where("somente-leitura.mjs")) === JSON.stringify(["Bash|PowerShell"])
              && JSON.stringify(where("portao-do-archive.mjs")) === JSON.stringify(["Bash|PowerShell"])
              && JSON.stringify(where("escopo-de-escrita.mjs")) === JSON.stringify(["Edit|Write"])
              && JSON.stringify(where("protege-ganchos.mjs")) === JSON.stringify(["Bash|PowerShell"])
              && JSON.stringify(where("exige-change.mjs")) === JSON.stringify(["Edit|Write"])
              && (s.hooks.SessionStart || []).some((g) => JSON.stringify(g.hooks).includes("contexto-de-sessao.mjs"));
            if (!ok || !placed) { console.error(JSON.stringify(s, null, 2)); process.exit(1); }' "$s"
          # A permissão que o projeto já tinha não vira do padrão.
          node -e '
            const m = JSON.parse(require("fs").readFileSync(process.argv[1], "utf8"));
            if ((m.managedSettings.ask || []).includes("Bash(git push *)")) process.exit(1);
            if (!(m.managedSettings.ask || []).includes("Bash(gh release *)")) process.exit(1);
            if (!m.managedFiles.includes(".claude/agents/openspec-code-reviewer.md")) process.exit(1);' "$p/.openspec-padrao.json"
          # Reinstalação sem mudanças: nada muda, nem sem modo.
          cp "$s" "$RUNNER_TEMP/settings-antes.json"
          node scripts/install-skills.mjs "$p" > "$RUNNER_TEMP/reinstalacao.txt"
          cmp "$RUNNER_TEMP/settings-antes.json" "$s"
          grep -qF 'Unchanged: .claude/settings.json' "$RUNNER_TEMP/reinstalacao.txt"
          # Versão que retira uma permissão: exige modo; com --in-place, só a entrada do padrão sai.
          st="$(mktemp -d)"
          cp -r . "$st/padrao-openspec"
          node -e '
            const fs = require("fs"); const f = process.argv[1]; const t = JSON.parse(fs.readFileSync(f, "utf8"));
            t.permissions.ask = t.permissions.ask.filter((rule) => rule !== "Bash(gh release *)");
            fs.writeFileSync(f, JSON.stringify(t, null, 2));' "$st/padrao-openspec/templates/claude-settings.json"
          if node "$st/padrao-openspec/scripts/install-skills.mjs" "$p" > "$RUNNER_TEMP/sem-modo.txt" 2>&1; then exit 1; fi
          grep -qF 'openspec-padrao entries' "$RUNNER_TEMP/sem-modo.txt"
          cmp "$RUNNER_TEMP/settings-antes.json" "$s"
          node "$st/padrao-openspec/scripts/install-skills.mjs" "$p" --in-place > /dev/null
          if grep -qF 'gh release' "$s"; then exit 1; fi
          grep -qF 'Bash(npm test)' "$s"
          grep -qF 'echo projeto' "$s"
          grep -qF 'Bash(git push *)' "$s"
          # CRLF, BOM e indentação de 4 espaços do projeto são mantidos.
          c="$(mktemp -d)"
          git -C "$c" init -q
          mkdir -p "$c/.claude"
          printf '\357\273\277{\r\n    "permissions": {\r\n        "allow": ["Bash(npm test)"]\r\n    }\r\n}\r\n' > "$c/.claude/settings.json"
          node scripts/install-skills.mjs "$c" > /dev/null
          head -c 3 "$c/.claude/settings.json" | od -An -tx1 | grep -q 'ef bb bf'
          node -e 'process.exit(require("fs").readFileSync(process.argv[1], "utf8").includes("\r\n") ? 0 : 1)' "$c/.claude/settings.json"
          grep -q '^        "allow"' "$c/.claude/settings.json"
          # Formato inválido (permissions.allow que não é lista): erro e nada escrito.
          v="$(mktemp -d)"
          git -C "$v" init -q
          mkdir -p "$v/.claude"
          printf '{ "permissions": { "allow": "Bash(npm test)" } }\n' > "$v/.claude/settings.json"
          if node scripts/install-skills.mjs "$v" > "$RUNNER_TEMP/forma.txt" 2>&1; then exit 1; fi
          grep -qF 'must be lists' "$RUNNER_TEMP/forma.txt"
          test ! -e "$v/.openspec-padrao.json"
          # Um subagente que sai do padrão é removido na atualização, e a reinstalação seguinte não trava.
          rt="$(mktemp -d)"
          cp -r . "$rt/padrao-openspec"
          rm "$rt/padrao-openspec/.claude/agents/openspec-task-planner.md"
          node "$rt/padrao-openspec/scripts/install-skills.mjs" "$c" --in-place > "$RUNNER_TEMP/retirado.txt"
          grep -qF 'Removed: .claude/agents/openspec-task-planner.md' "$RUNNER_TEMP/retirado.txt"
          test ! -e "$c/.claude/agents/openspec-task-planner.md"
          node "$rt/padrao-openspec/scripts/install-skills.mjs" "$c" > /dev/null
          rm -rf "$c" "$v" "$rt"
          # Atualização a partir do formato anterior, com um hook do projeto no mesmo grupo do padrão:
          # o hook do projeto fica, os do padrão vão para o lugar certo e a reinstalação não muda nada.
          u="$(mktemp -d)"
          git -C "$u" init -q
          mkdir -p "$u/.claude"
          printf '{\n  "hooks": {\n    "PreToolUse": [\n      { "matcher": "Bash|PowerShell", "hooks": [ { "type": "command", "command": "node", "args": ["${CLAUDE_PROJECT_DIR}/.claude/hooks/openspec-padrao/portao-do-archive.mjs"] }, { "type": "command", "command": "echo meu-bash" } ] }\n    ]\n  }\n}\n' > "$u/.claude/settings.json"
          node scripts/install-skills.mjs "$u" --in-place > /dev/null
          grep -qF 'echo meu-bash' "$u/.claude/settings.json"
          grep -qF 'escopo-de-escrita.mjs' "$u/.claude/settings.json"
          cp "$u/.claude/settings.json" "$RUNNER_TEMP/misto.json"
          node scripts/install-skills.mjs "$u" > /dev/null
          cmp "$RUNNER_TEMP/misto.json" "$u/.claude/settings.json"
          rm -rf "$u"
          # JSON inválido: erro e nada escrito.
          q="$(mktemp -d)"
          git -C "$q" init -q
          mkdir -p "$q/.claude"
          printf '{ "permissions": { "allow": ["x",] } }\n' > "$q/.claude/settings.json"
          if node scripts/install-skills.mjs "$q" > "$RUNNER_TEMP/json.txt" 2>&1; then exit 1; fi
          grep -qF 'is not valid JSON' "$RUNNER_TEMP/json.txt"
          test ! -e "$q/.openspec-padrao.json"
          test ! -e "$q/.claude/agents"
          # Agente do projeto com o prefixo reservado: erro e nada escrito.
          r="$(mktemp -d)"
          git -C "$r" init -q
          mkdir -p "$r/.claude/agents"
          echo x > "$r/.claude/agents/openspec-revisor.md"
          if node scripts/install-skills.mjs "$r" > "$RUNNER_TEMP/alheio.txt" 2>&1; then exit 1; fi
          grep -qF 'openspec-revisor.md' "$RUNNER_TEMP/alheio.txt"
          test ! -e "$r/.openspec-padrao.json"
          rm -rf "$p" "$q" "$r" "$st"

      - name: Smoke test do setup de projeto
        run: |
          work="$(mktemp -d)"
          cp -r . "$work/store"
          # A cópia de padrao-openspec/ não leva o .git da raiz; o commit permite ao setup
          # reconhecer project.md e config.yaml intactos e não gerar backups .bak.
          git -C "$work/store" init -q
          git -C "$work/store" add -A
          git -C "$work/store" -c user.name=ci -c user.email=ci@example.invalid commit -qm base
          mkdir "$work/code"
          git -C "$work/code" init -q
          # Sem preset (ADR-0003): o setup só grava o nome do projeto; o config.yaml continua neutro.
          node "$work/store/scripts/setup-project.mjs" "$work/code" --name "CI Project" --yes --no-register
          cmp "$work/store/openspec/config.yaml" openspec/config.yaml
          head -n 1 "$work/store/openspec/project.md" | grep -q '^# CI Project '
          test "$(sed 1d "$work/store/openspec/project.md")" = "$(sed 1d openspec/project.md)"
          test ! -e "$work/code/.agents/skills/dotnet-implementation"
          test ! -e "$work/code/.agents/skills/nextjs-implementation"
          test -z "$(find "$work/store/openspec" -maxdepth 1 -name '*.bak')"
          # --stack foi removido: o setup recusa antes de alterar o store ou o código.
          before="$(cat "$work/store/openspec/project.md")"
          fresh="$(mktemp -d)"
          git -C "$fresh" init -q
          if node "$work/store/scripts/setup-project.mjs" "$fresh" --stack nextjs --yes 2> "$RUNNER_TEMP/setup-stack-err.txt"; then exit 1; fi
          grep -qF -- '--stack was removed' "$RUNNER_TEMP/setup-stack-err.txt"
          test "$(cat "$work/store/openspec/project.md")" = "$before"
          test ! -e "$fresh/.agents"

      # Fluxo recomendado: o store é uma subpasta (padrao-openspec/) de um repositório git.
      # Sem --name, o setup não altera project.md nem config.yaml.
      - name: Smoke test do setup em subpasta
        run: |
          work="$(mktemp -d)"
          mkdir -p "$work/repo" "$work/code"
          cp -r . "$work/repo/padrao-openspec"
          git -C "$work/repo" init -q
          git -C "$work/repo" add -A
          git -C "$work/repo" -c user.name=ci -c user.email=ci@example.invalid commit -qm base
          git -C "$work/code" init -q
          node "$work/repo/padrao-openspec/scripts/setup-project.mjs" "$work/code" --no-register --yes
          test -z "$(git -C "$work/repo" status --porcelain -- padrao-openspec/openspec)"
          test -f "$work/code/.claude/commands/opsx/init.md"

      # Store clonado do padrão: o origin é renomeado para "padrao", para que um push no store
      # não publique os artefatos do projeto no repositório do padrão.
      - name: Smoke test do remote do padrão
        run: |
          prepare() {
            local dir="$1" url="$2"
            mkdir -p "$dir/repo" "$dir/code"
            cp -r . "$dir/repo/padrao-openspec"
            git -C "$dir/repo" init -q
            git -C "$dir/code" init -q
            if [ -n "$url" ]; then git -C "$dir/repo" remote add origin "$url"; fi
          }
          work="$(mktemp -d)"
          prepare "$work/padrao" https://github.com/Gilmar1987/PadraoOpenspct.git
          node "$work/padrao/repo/padrao-openspec/scripts/setup-project.mjs" "$work/padrao/code" --no-register --yes > "$RUNNER_TEMP/remote.txt"
          test "$(git -C "$work/padrao/repo" remote)" = "padrao"
          grep -qF 'remote add origin' "$RUNNER_TEMP/remote.txt"
          grep -qF 'remote rename padrao origin' "$RUNNER_TEMP/remote.txt"
          # --keep-origin mantém o origin.
          prepare "$work/keep" https://github.com/Gilmar1987/PadraoOpenspct
          node "$work/keep/repo/padrao-openspec/scripts/setup-project.mjs" "$work/keep/code" --no-register --keep-origin --yes
          test "$(git -C "$work/keep/repo" remote)" = "origin"
          # origin de outro repositório: nada muda.
          prepare "$work/proprio" https://github.com/acme/livraria-openspec.git
          node "$work/proprio/repo/padrao-openspec/scripts/setup-project.mjs" "$work/proprio/code" --no-register --yes
          test "$(git -C "$work/proprio/repo" remote)" = "origin"

      - name: Smoke test da declaração do store
        run: |
          sfx="${GITHUB_RUN_ID:-local}-${GITHUB_RUN_ATTEMPT:-0}-$$-$RANDOM"
          trap 'openspec store unregister "ci-store-$sfx" >/dev/null 2>&1 || true' EXIT
          work="$(mktemp -d)"
          cp -r . "$work/store"
          mkdir "$work/code"
          git -C "$work/code" init -q
          node "$work/store/scripts/setup-project.mjs" "$work/code" --name "CI Store" --register-id ci-store-$sfx --yes
          grep -qx "store: ci-store-$sfx" "$work/code/openspec/config.yaml"
          # Os dois caminhos passam pelo Node para ficarem no mesmo formato também no Windows.
          resolved="$(cd "$work/code" && openspec context --json | node -e 'let d="";process.stdin.on("data",c=>d+=c).on("end",()=>console.log(require("fs").realpathSync(JSON.parse(d).root.path)))')"
          expected="$(cd "$work/store" && node -p 'require("fs").realpathSync(process.cwd())')"
          test "$resolved" = "$expected"
          # Declaração conflitante: o setup recusa sem --force e não altera o arquivo.
          mkdir -p "$work/other/openspec"
          git -C "$work/other" init -q
          printf 'store: outro\n' > "$work/other/openspec/config.yaml"
          if node "$work/store/scripts/setup-project.mjs" "$work/other" --register-id ci-store-$sfx --yes; then exit 1; fi
          grep -qx 'store: outro' "$work/other/openspec/config.yaml"
          # Com --force, a declaração existente é substituída e o store volta a ser resolvido.
          node "$work/store/scripts/setup-project.mjs" "$work/other" --register-id ci-store-$sfx --force --yes
          grep -qx "store: ci-store-$sfx" "$work/other/openspec/config.yaml"
          test "$(grep -c '^store:' "$work/other/openspec/config.yaml")" -eq 1

      # Script de entrada (comecar.mjs) contra um padrão local com tags: projeto novo com um
      # único clone na última release, entrada num projeto em andamento e as recusas.
      - name: Smoke test do script de entrada
        run: |
          sfx="${GITHUB_RUN_ID:-local}-${GITHUB_RUN_ATTEMPT:-0}-$$-$RANDOM"
          trap 'for id in ci-entrada-$sfx ci-semcommit-$sfx ci-semident-$sfx ci-falta-$sfx; do openspec store unregister "$id" >/dev/null 2>&1 || true; done' EXIT
          # O script faz o commit inicial; o runner não tem identidade Git configurada.
          export GIT_AUTHOR_NAME=ci GIT_AUTHOR_EMAIL=ci@example.invalid GIT_COMMITTER_NAME=ci GIT_COMMITTER_EMAIL=ci@example.invalid
          work="$(mktemp -d)"
          v="$(tr -d '\r\n' < VERSION)"
          commit() { git -C "$1" -c user.name=ci -c user.email=ci@example.invalid commit -q "${@:2}"; }
          mkdir -p "$work/padrao"
          cp -r . "$work/padrao/padrao-openspec"
          git -C "$work/padrao" init -q
          git -C "$work/padrao" add -A
          commit "$work/padrao" -m base
          git -C "$work/padrao" tag v1.0.0
          commit "$work/padrao" --allow-empty -m next
          git -C "$work/padrao" tag "v$v"
          # Projeto novo: store na última tag, na branch main, e código ligado a ele.
          node scripts/comecar.mjs --origem "$work/padrao" --modo novo --pasta "$work/a" --nome "CI Entrada" --id ci-entrada-$sfx --yes > "$RUNNER_TEMP/novo.txt"
          store="$work/a/ci-entrada-$sfx-openspec"
          code="$work/a/ci-entrada-$sfx"
          test "$(git -C "$store" branch --show-current)" = main
          # O commit de configuração fica por cima da tag da release clonada.
          test "$(git -C "$store" describe --tags --abbrev=0)" = "v$v"
          test -f "$code/.claude/commands/opsx/init.md"
          grep -qx "store: ci-entrada-$sfx" "$code/openspec/config.yaml"
          grep -qF '/opsx:init' "$RUNNER_TEMP/novo.txt"
          grep -qF 'pasta do workspace' "$RUNNER_TEMP/novo.txt"
          # Commit inicial: um commit no código, o de configuração no store, as duas árvores limpas.
          test "$(git -C "$code" rev-list --count HEAD)" -eq 1
          git -C "$store" log -1 --format=%s | grep -qF 'configura o store'
          test -z "$(git -C "$code" status --porcelain)"
          test -z "$(git -C "$store" status --porcelain)"
          grep -qF 'Commit inicial' "$RUNNER_TEMP/novo.txt"
          # A pasta do projeto já existe: recusa sem alterar nada.
          before="$(git -C "$store" status --porcelain)"
          if node scripts/comecar.mjs --origem "$work/padrao" --modo novo --pasta "$work/a" --nome "CI Entrada" --id ci-entrada-$sfx --yes; then exit 1; fi
          test "$(git -C "$store" status --porcelain)" = "$before"
          # Sem terminal, uma resposta que falta para com a opção que a informa.
          if node scripts/comecar.mjs --origem "$work/padrao" --modo novo --pasta "$work/c" --id ci-falta-$sfx --yes < /dev/null 2> "$RUNNER_TEMP/falta.txt"; then exit 1; fi
          grep -qF 'Falta --nome' "$RUNNER_TEMP/falta.txt"
          test ! -e "$work/c/ci-falta-$sfx-openspec"
          # Id já registrado nesta máquina: recusa antes do resumo, sem criar pastas.
          if node scripts/comecar.mjs --origem "$work/padrao" --modo novo --pasta "$work/e" --nome "CI Entrada" --id ci-entrada-$sfx --yes 2> "$RUNNER_TEMP/registrado.txt"; then exit 1; fi
          grep -qF "openspec store unregister ci-entrada-$sfx" "$RUNNER_TEMP/registrado.txt"
          test ! -e "$work/e"
          # Com --sem-commit, o código fica sem histórico e a mensagem mostra como commitar.
          node scripts/comecar.mjs --origem "$work/padrao" --modo novo --pasta "$work/f" --nome "CI Sem Commit" --id ci-semcommit-$sfx --yes --sem-commit > "$RUNNER_TEMP/semcommit.txt"
          if git -C "$work/f/ci-semcommit-$sfx" rev-parse -q --verify HEAD; then exit 1; fi
          grep -qF 'git -C' "$RUNNER_TEMP/semcommit.txt"
          openspec store unregister ci-semcommit-$sfx
          # Sem identidade Git: o script avisa, mostra os comandos e termina com código zero.
          GIT_CONFIG_GLOBAL=/dev/null GIT_AUTHOR_NAME= GIT_COMMITTER_NAME= GIT_AUTHOR_EMAIL= GIT_COMMITTER_EMAIL= \
            node scripts/comecar.mjs --origem "$work/padrao" --modo novo --pasta "$work/g" --nome "CI Sem Ident" --id ci-semident-$sfx --yes > "$RUNNER_TEMP/semident.txt" 2>&1
          grep -qF 'não consegui fazer o commit inicial' "$RUNNER_TEMP/semident.txt"
          if git -C "$work/g/ci-semident-$sfx" rev-parse -q --verify HEAD; then exit 1; fi
          openspec store unregister ci-semident-$sfx
          # Projeto em andamento: publica os dois repositórios e entra por outra pasta.
          git -C "$code" add -A
          git -C "$code" diff --cached --quiet || commit "$code" -m setup
          git -C "$store" add -A
          git -C "$store" diff --cached --quiet || commit "$store" -m init
          mkdir "$work/remotos"
          git clone -q --bare "$code" "$work/remotos/ci-entrada-$sfx.git"
          git clone -q --bare "$store" "$work/remotos/ci-entrada-$sfx-openspec.git"
          openspec store unregister ci-entrada-$sfx
          node scripts/comecar.mjs --modo existente --pasta "$work/b" --url-codigo "$work/remotos/ci-entrada-$sfx.git" --url-store "$work/remotos/ci-entrada-$sfx-openspec.git" --yes > "$RUNNER_TEMP/existente.txt"
          # Os dois caminhos passam pelo Node para ficarem no mesmo formato também no Windows.
          resolved="$(cd "$work/b/ci-entrada-$sfx" && openspec context --json | node -e 'let d="";process.stdin.on("data",c=>d+=c).on("end",()=>console.log(require("fs").realpathSync(JSON.parse(d).root.path)))')"
          expected="$(cd "$work/b/ci-entrada-$sfx-openspec/padrao-openspec" && node -p 'require("fs").realpathSync(process.cwd())')"
          test "$resolved" = "$expected"
          grep -qF '/opsx:propose' "$RUNNER_TEMP/existente.txt"
          grep -qF 'pasta do workspace' "$RUNNER_TEMP/existente.txt"
          grep -qF 'não rode /opsx:init' "$RUNNER_TEMP/existente.txt"
          # Código sem a linha store: recusa sem registrar nada.
          mkdir "$work/sem-store"
          git -C "$work/sem-store" init -q
          commit "$work/sem-store" --allow-empty -m vazio
          git clone -q --bare "$work/sem-store" "$work/remotos/sem-store.git"
          registered="$(openspec store list --json)"
          if node scripts/comecar.mjs --modo existente --pasta "$work/d" --url-codigo "$work/remotos/sem-store.git" --url-store "$work/remotos/ci-entrada-$sfx-openspec.git" --yes 2> "$RUNNER_TEMP/sem-store.txt"; then exit 1; fi
          grep -qF 'store:' "$RUNNER_TEMP/sem-store.txt"
          test "$(openspec store list --json)" = "$registered"
          openspec store unregister ci-entrada-$sfx

      # No Windows, a pasta base digitada com o drive em minúscula (c:\...) não pode virar um falso
      # "not this store": o CLI devolve C:\..., e a comparação tem de reconhecer a mesma pasta.
      # O %TEMP% do runner fica em c:\Users\RUNNER~1, então o passo cobre também o nome curto 8.3.
      - name: Smoke test do drive minúsculo
        if: runner.os == 'Windows'
        run: |
          sfx="${GITHUB_RUN_ID:-local}-${GITHUB_RUN_ATTEMPT:-0}-$$-$RANDOM"
          trap 'openspec store unregister ci-drive-$sfx >/dev/null 2>&1 || true' EXIT
          work="$(mktemp -d)"
          v="$(tr -d '\r\n' < VERSION)"
          commit() { git -C "$1" -c user.name=ci -c user.email=ci@example.invalid commit -q "${@:2}"; }
          mkdir -p "$work/padrao"
          cp -r . "$work/padrao/padrao-openspec"
          # O .gitattributes da raiz mantém LF no repositório temporário, como no checkout.
          cp ../.gitattributes "$work/padrao/"
          git -C "$work/padrao" init -q
          git -C "$work/padrao" add -A
          commit "$work/padrao" -m base
          git -C "$work/padrao" tag "v$v"
          low="$(cygpath -w "$work" | sed -E 's/^([A-Za-z]):/\L\1:/')"
          node scripts/comecar.mjs --origem "$work/padrao" --modo novo --pasta "$low\a" --nome "CI Drive" --id ci-drive-$sfx --yes
          git -C "$work/a/ci-drive-$sfx" add -A
          git -C "$work/a/ci-drive-$sfx" diff --cached --quiet || commit "$work/a/ci-drive-$sfx" -m setup
          git -C "$work/a/ci-drive-$sfx-openspec" add -A
          git -C "$work/a/ci-drive-$sfx-openspec" diff --cached --quiet || commit "$work/a/ci-drive-$sfx-openspec" -m init
          mkdir "$work/remotos"
          git clone -q --bare "$work/a/ci-drive-$sfx" "$work/remotos/ci-drive-$sfx.git"
          git clone -q --bare "$work/a/ci-drive-$sfx-openspec" "$work/remotos/ci-drive-$sfx-openspec.git"
          openspec store unregister ci-drive-$sfx
          node scripts/comecar.mjs --modo existente --pasta "$low\b" --url-codigo "$work/remotos/ci-drive-$sfx.git" --url-store "$work/remotos/ci-drive-$sfx-openspec.git" --yes
          resolved="$(cd "$work/b/ci-drive-$sfx" && openspec context --json | node -e 'let d="";process.stdin.on("data",c=>d+=c).on("end",()=>console.log(require("fs").realpathSync.native(JSON.parse(d).root.path)))')"
          expected="$(cd "$work/b/ci-drive-$sfx-openspec/padrao-openspec" && node -p 'require("fs").realpathSync.native(process.cwd())')"
          test "$resolved" = "$expected"
          openspec store unregister ci-drive-$sfx

      # Validação de interface (qualidade-de-interface): navegador real contra páginas estáticas locais.
      # Só no Linux: o download do navegador pesa, e o script é o mesmo nos dois sistemas.
      - name: Cache do navegador da validação de interface
        if: runner.os == 'Linux'
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/openspec-validar-interface
          key: validar-interface-${{ runner.os }}-${{ hashFiles('padrao-openspec/scripts/validar-interface.mjs') }}

      - name: Smoke test da validação de interface
        if: runner.os == 'Linux'
        env:
          OPENSPEC_VALIDAR_INTERFACE_DIR: ${{ runner.temp }}/openspec-validar-interface
        run: |
          fx=scripts/test-fixtures/interface
          out=$(mktemp -d)
          node "$fx/servidor.mjs" "$fx/boa" 4173 > "$out/boa.log" &
          s1=$!
          node "$fx/servidor.mjs" "$fx/ruim" 4174 > "$out/ruim.log" &
          s2=$!
          trap 'kill $s1 $s2 2>/dev/null || true' EXIT
          for _ in $(seq 1 30); do
            grep -q 4173 "$out/boa.log" && grep -q 4174 "$out/ruim.log" && break
            sleep 1
          done
          grep -q 4173 "$out/boa.log" && grep -q 4174 "$out/ruim.log" || { cat "$out"/*.log; echo "::error::Servidores das fixtures não subiram"; exit 1; }
          # Página boa com jornadas: saída 0, nota médio ou bom, capturas nas três larguras.
          node scripts/validar-interface.mjs http://127.0.0.1:4173/ --jornadas "$fx/jornadas.json" --saida "$out/boa" --json > "$out/boa.json"
          grep -Eq '"nota": *"(médio|bom)"' "$out/boa.json"
          grep -q 'Cadastro com nome' "$out/boa/interface-report.md"
          # O 422 esperado da jornada de erro aparece em "Respostas de rede" sem derrubar a nota, e o botão
          # que surge depois de um atraso é encontrado pela jornada.
          grep -q '422' "$out/boa/interface-report.md"
          grep -q '### Novidades que aparecem depois: aprovada' "$out/boa/interface-report.md"
          for w in 390 768 1280; do ls "$out/boa/interface/capturas/" | grep -q -- "-$w\.png$"; done
          # Cada passo "conferir" deixa a captura do estado da tela.
          test -f "$out/boa/interface/capturas/jornada-1-passo-4.png"
          # Página com problemas plantados: saída 1, e o relatório cita texto alternativo, console e link.
          set +e
          node scripts/validar-interface.mjs http://127.0.0.1:4174/ --saida "$out/ruim"
          code=$?
          set -e
          [ "$code" = 1 ]
          grep -q 'fraco' "$out/ruim/interface-report.md"
          grep -q 'image-alt' "$out/ruim/interface-report.md"
          grep -q 'falha ao carregar o carrinho' "$out/ruim/interface-report.md"
          grep -q '/promocoes.html' "$out/ruim/interface-report.md"
          grep -q 'faltando.png' "$out/ruim/interface-report.md"
          # O relatório fica na pasta da change e passa pelo lint de Markdown do projeto.
          npx --yes markdownlint-cli2@0.23.2 --config .markdownlint-cli2.jsonc "$out/boa/interface-report.md" "$out/ruim/interface-report.md"
          # URL fora do ar: erro de ambiente (saída 2).
          set +e
          node scripts/validar-interface.mjs http://127.0.0.1:4199/ --saida "$out/fora"
          code=$?
          set -e
          [ "$code" = 2 ]

      # Portão (docs/openspec-portao.mjs): resposta determinística, para qualquer agente, sobre
      # escrever código (apply) e arquivar (archive); o hook commit-msg é opcional.
      - name: Smoke test do portão
        run: |
          sfx="${GITHUB_RUN_ID:-local}-${GITHUB_RUN_ATTEMPT:-0}-$$-$RANDOM"
          trap 'openspec store unregister ci-portao-$sfx >/dev/null 2>&1 || true' EXIT
          export GIT_AUTHOR_NAME=ci GIT_AUTHOR_EMAIL=ci@example.invalid GIT_COMMITTER_NAME=ci GIT_COMMITTER_EMAIL=ci@example.invalid
          work="$(mktemp -d)"
          mkdir -p "$work/repo" "$work/code"
          cp -r . "$work/repo/padrao-openspec"
          git -C "$work/repo" init -q
          git -C "$work/code" init -q
          node "$work/repo/padrao-openspec/scripts/setup-project.mjs" "$work/code" --register-id ci-portao-$sfx --yes > /dev/null
          cmp "$work/code/docs/openspec-portao.mjs" scripts/portao.mjs
          cmp "$work/code/docs/openspec-validar-interface.mjs" scripts/validar-interface.mjs
          ch="$work/repo/padrao-openspec/openspec/changes/ci-change"
          mkdir -p "$ch"
          proposal() { printf '# Proposal\n\n## Why\n\nTeste.\n\n## Aprovação\n\n- Responsável: %s\n- Data: %s\n- Escopo: %s\n- Condições: —\n- Origem: %s\n' "$@" > "$ch/proposal.md"; }
          gate() { (cd "$work/code" && node docs/openspec-portao.mjs "$@"); }
          codecommit() { printf '%s\n' "$1" > "$work/code/$1.txt"; git -C "$work/code" add "$1.txt"; git -C "$work/code" commit -q -m "feat: $1" -m "OpenSpec-Change: $2"; }
          printf '# Tasks\n\n## 1. A\n\n- [x] 1.1 a\n- [ ] 1.2 b\n' > "$ch/tasks.md"
          # Aprovação pendente (também com texto extra): apply bloqueia (1), em texto e em JSON.
          proposal Pendente — — —
          if gate apply ci-change > "$RUNNER_TEMP/portao1.txt"; then exit 1; fi
          grep -qiF 'pendente' "$RUNNER_TEMP/portao1.txt"
          out="$(gate apply ci-change --json || true)"
          grep -qF '"ok":false' <<< "$out"
          grep -qF '"motivos":[' <<< "$out"
          proposal 'Pendente (aguardando ci)' 2026-10-22 apply '"Aprovo"'
          if gate apply ci-change; then exit 1; fi
          # Aprovação de apply: libera o apply e bloqueia o archive.
          proposal ci 2026-10-22 apply '"Aprovo"'
          gate apply ci-change
          if gate archive ci-change; then exit 1; fi
          # Escopo archive (entre crases vale), tarefa pendente e sem verification.md: bloqueia citando as duas.
          proposal ci 2026-10-22 '`archive`' '"Aprovo para archive"'
          if gate archive ci-change > "$RUNNER_TEMP/portao2.txt"; then exit 1; fi
          grep -qF 'tarefa' "$RUNNER_TEMP/portao2.txt"
          grep -qF 'verification.md' "$RUNNER_TEMP/portao2.txt"
          printf '# Tasks\n\n## 1. A\n\n- [x] 1.1 a\n- [x] 1.2 b\n' > "$ch/tasks.md"
          printf '# Verificações\n' > "$ch/verification.md"
          # Prefixo de nome não conta: só um commit de código de "ci-change-extra" não exige review.md.
          codecommit extra ci-change-extra
          gate archive ci-change
          # Com um commit de código da própria change, o review.md passa a ser exigido.
          codecommit feature ci-change
          if gate archive ci-change > "$RUNNER_TEMP/portao3.txt"; then exit 1; fi
          grep -qF 'review.md' "$RUNNER_TEMP/portao3.txt"
          printf '# Revisão\n' > "$ch/review.md"
          gate archive ci-change
          # Selo do conteúdo aprovado (aprovacao-por-conteudo): ignora caixas e evidências, vence com uma
          # tarefa nova, volta a valer com a reconfirmação; aprovação sem selo segue, com aviso.
          selo="$(gate selo ci-change)"
          grep -Eqx 'sha256:[0-9a-f]{64}' <<< "$selo"
          sealed() { proposal ci 2026-10-22 apply '"Aprovo"'; printf -- '- Conteúdo: %s\n' "$1" >> "$ch/proposal.md"; }
          sealed "$selo"
          gate apply ci-change
          printf '# Tasks\n\n## 1. A\n\n- [ ] 1.1 a\n  - Evidência: `x` → ok (exit 0)\n- [X] 1.2 b\n' > "$ch/tasks.md"
          test "$(gate selo ci-change)" = "$selo"
          printf '# Tasks\n\n## 1. A\n\n- [x] 1.1 a\n- [x] 1.2 b\n- [ ] 1.3 nova\n' > "$ch/tasks.md"
          if gate apply ci-change > "$RUNNER_TEMP/selo1.txt"; then exit 1; fi
          grep -qF 'venceu' "$RUNNER_TEMP/selo1.txt"
          novo="$(gate selo ci-change)"
          test "$novo" != "$selo"
          printf -- '- Reconfirmação: 2026-10-22; Origem: "confirmo"; Conteúdo: %s\n' "$novo" >> "$ch/proposal.md"
          gate apply ci-change
          proposal ci 2026-10-22 apply '"Aprovo"'
          out="$(gate apply ci-change --json)"
          grep -qF '"avisos":[' <<< "$out"
          # Inferência marcada bloqueia o apply citando arquivo e linha; entre crases é documentação.
          printf '# Design\n\nLimite de 20%% [INFERIDO: prática de varejo].\n' > "$ch/design.md"
          if gate apply ci-change > "$RUNNER_TEMP/selo2.txt"; then exit 1; fi
          grep -qF 'design.md:3' "$RUNNER_TEMP/selo2.txt"
          printf '# Design\n\nUse a marca `[INFERIDO: base]` no propose.\n' > "$ch/design.md"
          gate apply ci-change
          # Fim de linha CRLF não muda o selo.
          lf="$(gate selo ci-change)"
          printf '# Design\r\n\r\nUse a marca `[INFERIDO: base]` no propose.\r\n' > "$ch/design.md"
          test "$(gate selo ci-change)" = "$lf"
          rm "$ch/design.md"
          # Depois de uma mudança de escopo, a linha "Aprovação anterior" guarda o selo velho e não conta.
          velho="$(gate selo ci-change)"
          printf '# Tasks\n\n## 1. A\n\n- [x] 1.1 a\n- [x] 1.2 b\n- [ ] 1.4 escopo novo\n' > "$ch/tasks.md"
          sealed "$(gate selo ci-change)"
          printf -- '- Aprovação anterior: ci, 2026-10-21, apply; Origem: "antes"; Conteúdo: %s\n' "$velho" >> "$ch/proposal.md"
          gate apply ci-change
          # .inputs/ (originais do ingest, fora do git) e relatórios gravados depois não mudam o selo.
          antes="$(gate selo ci-change)"
          mkdir -p "$ch/.inputs" && printf '# Ata\n' > "$ch/.inputs/ata.md"
          printf '# Revisão 2\n' >> "$ch/review.md"
          test "$(gate selo ci-change)" = "$antes"
          # Confirmar uma inferência (apagar a marca) não muda o selo; selo malformado bloqueia.
          printf '# Design\n\nPrazo de 30 dias [INFERIDO: mercado].\n' > "$ch/design.md"
          com="$(gate selo ci-change)"
          printf '# Design\n\nPrazo de 30 dias.\n' > "$ch/design.md"
          test "$(gate selo ci-change)" = "$com"
          rm "$ch/design.md"
          proposal ci 2026-10-22 apply '"Aprovo"'
          printf -- '- Conteudo: sha256:deadbeef\n' >> "$ch/proposal.md"
          if gate apply ci-change > "$RUNNER_TEMP/selo3.txt"; then exit 1; fi
          grep -qF 'ilegível' "$RUNNER_TEMP/selo3.txt"
          # Change inexistente, nome inválido e store não resolvido: erro de uso ou de ambiente (2).
          set +e; gate apply nao-existe; status=$?; set -e
          test "$status" -eq 2
          set +e; gate apply 'nome%invalido'; status=$?; set -e
          test "$status" -eq 2
          mkdir -p "$work/sem-store"
          git -C "$work/sem-store" init -q
          set +e; out="$(cd "$work/sem-store" && node "$work/code/docs/openspec-portao.mjs" apply ci-change --json)"; status=$?; set -e
          test "$status" -eq 2
          grep -qF -- '--store' <<< "$out"
          grep -qF '"motivos":[' <<< "$out"
          # Hook opcional: recusa commit de código de change não aprovada; libera commit sem trailer,
          # commit que só toca openspec/ e commit que cita change arquivada (retrabalho).
          proposal Pendente — — —
          gate instalar-hook
          if codecommit recusado ci-change; then exit 1; fi
          git -C "$work/code" reset -q
          git -C "$work/code" commit -q --allow-empty -m "chore: sem trailer"
          codecommit retrabalho change-arquivada
          printf "store: ci-portao-$sfx\n# nota\n" > "$work/code/openspec/config.yaml"
          git -C "$work/code" add openspec/config.yaml
          git -C "$work/code" commit -q -m "docs: planejamento" -m "OpenSpec-Change: ci-change"
          # estado (ganchos-de-sessao-e-fluxo): aprovação, progresso e próximo passo de cada change ativa.
          out="$(gate estado --json)"
          grep -qF '"change":"ci-change"' <<< "$out"
          grep -qF '"aprovacao":"pendente"' <<< "$out"
          grep -qF 'pedir a aprovação' <<< "$out"
          proposal ci 2026-10-22 archive '"Aprovo para archive"'
          printf '# Tasks\n\n## 1. A\n\n- [x] 1.1 a\n- [ ] 1.2 b\n' > "$ch/tasks.md"
          grep -qF '/opsx:apply' <<< "$(gate estado --json)"
          printf '# Tasks\n\n## 1. A\n\n- [x] 1.1 a\n- [x] 1.2 b\n' > "$ch/tasks.md"
          rm "$ch/verification.md"
          grep -qF '/opsx:verify' <<< "$(gate estado --json)"
          printf '# Verificações\n' > "$ch/verification.md"
          grep -qF '/opsx:archive' <<< "$(gate estado --json)"
          proposal ci 2026-10-22 apply '"Aprovo"'
          grep -qF 'pedir a confirmação do archive' <<< "$(gate estado --json)"
          printf -- '- Conteúdo: sha256:%064d\n' 0 >> "$ch/proposal.md"
          grep -qF '"selo":"vencido"' <<< "$(gate estado --json)"
          proposal ci 2026-10-22 archive '"Aprovo para archive"'
          printf '# Design\n\nPrazo [INFERIDO: mercado].\n' > "$ch/design.md"
          grep -qF '"inferencias":1' <<< "$(gate estado --json)"
          rm "$ch/design.md"
          gate estado | grep -qF 'ci-change: 2/2 tarefas'

      # Regras do padrão entregues ao código por blocos gerenciados (ADR-0005): o conteúdo fora dos
      # marcadores fica intacto, a reinstalação não duplica e um bloco quebrado faz o instalador parar.
      - name: Smoke test dos blocos de agentes
        run: |
          # O --update do instalador faz commit; o runner não tem identidade Git configurada.
          export GIT_AUTHOR_NAME=ci GIT_AUTHOR_EMAIL=ci@example.invalid GIT_COMMITTER_NAME=ci GIT_COMMITTER_EMAIL=ci@example.invalid
          work="$(mktemp -d)"
          commit() { git -C "$1" -c user.name=ci -c user.email=ci@example.invalid commit -q "${@:2}"; }
          code="$work/code"
          mkdir -p "$code"
          git -C "$code" init -q
          printf '<!-- BEGIN:nextjs-agent-rules -->\nregras do next\n<!-- END:nextjs-agent-rules -->\n' > "$code/AGENTS.md"
          cp "$code/AGENTS.md" "$work/next-block.txt"
          node scripts/install-skills.mjs "$code"
          head -n 3 "$code/AGENTS.md" | cmp - "$work/next-block.txt"
          for f in AGENTS.md CLAUDE.md GEMINI.md .github/copilot-instructions.md .amazonq/rules/openspec-padrao.md; do
            test "$(grep -c '<!-- BEGIN:openspec-padrao -->' "$code/$f")" -eq 1
            test "$(grep -c '<!-- END:openspec-padrao -->' "$code/$f")" -eq 1
          done
          grep -qx '@AGENTS.md' "$code/CLAUDE.md"
          grep -qF 'docs/openspec-regras.md' "$code/AGENTS.md"
          cmp "$code/docs/openspec-regras.md" openspec/rules.md
          grep -qF '"docs/openspec-regras.md"' "$code/.openspec-padrao.json"
          grep -qF '"managedBlocks"' "$code/.openspec-padrao.json"
          # Segunda instalação da mesma versão: os arquivos de instrução não mudam.
          before="$(cat "$code/AGENTS.md" "$code/CLAUDE.md" "$code/GEMINI.md")"
          node scripts/install-skills.mjs "$code"
          test "$(cat "$code/AGENTS.md" "$code/CLAUDE.md" "$code/GEMINI.md")" = "$before"
          # Bloco de uma versão anterior: exige um modo; com --update, um só bloco, no commit.
          git -C "$code" add -A
          commit "$code" -m base
          perl -0pi -e 's/(<!-- BEGIN:openspec-padrao -->).*?(<!-- END:openspec-padrao -->)/$1\ntexto antigo\n$2/s' "$code/AGENTS.md"
          git -C "$code" add -A
          commit "$code" -m antigo
          if node scripts/install-skills.mjs "$code"; then exit 1; fi
          grep -qF 'texto antigo' "$code/AGENTS.md"
          node scripts/install-skills.mjs "$code" --update
          test "$(grep -c '<!-- BEGIN:openspec-padrao -->' "$code/AGENTS.md")" -eq 1
          if grep -qF 'texto antigo' "$code/AGENTS.md"; then exit 1; fi
          head -n 3 "$code/AGENTS.md" | cmp - "$work/next-block.txt"
          git -C "$code" show --stat --format= HEAD | grep -qF 'AGENTS.md'
          # Arquivo de instrução ignorado pelo projeto: não é criado, e o --update funciona.
          ignored="$work/ignored"
          mkdir -p "$ignored"
          git -C "$ignored" init -q
          printf 'CLAUDE.md\n' > "$ignored/.gitignore"
          git -C "$ignored" add -A
          commit "$ignored" -m base
          node scripts/install-skills.mjs "$ignored" --update > "$RUNNER_TEMP/blocos-ignored.txt"
          grep -qF 'Skipped: CLAUDE.md' "$RUNNER_TEMP/blocos-ignored.txt"
          test ! -e "$ignored/CLAUDE.md"
          git -C "$ignored" show --stat --format= HEAD | grep -qF 'AGENTS.md'
          # BEGIN sem END: o instalador para antes de alterar qualquer arquivo.
          broken="$work/broken"
          mkdir -p "$broken"
          git -C "$broken" init -q
          printf 'conteúdo do projeto\n<!-- BEGIN:openspec-padrao -->\nsem fim\n' > "$broken/AGENTS.md"
          cp "$broken/AGENTS.md" "$work/broken-before.txt"
          if node scripts/install-skills.mjs "$broken" 2> "$RUNNER_TEMP/blocos-err.txt"; then exit 1; fi
          grep -qF 'openspec-padrao' "$RUNNER_TEMP/blocos-err.txt"
          cmp "$broken/AGENTS.md" "$work/broken-before.txt"
          test ! -e "$broken/.claude"

      # Store e repositório de código de exemplo com datas conhecidas e autor fictício:
      # confere o CSV linha a linha, o resumo, a ausência de dados pessoais e que nada muda.
      - name: Smoke test das métricas de fluxo
        run: |
          work="$(mktemp -d)"
          export GIT_AUTHOR_NAME="Fulana Silva" GIT_AUTHOR_EMAIL="fulana@example.com"
          export GIT_COMMITTER_NAME="Fulana Silva" GIT_COMMITTER_EMAIL="fulana@example.com"
          commit() { GIT_AUTHOR_DATE="$2T12:00:00" GIT_COMMITTER_DATE="$2T12:00:00" git -C "$1" commit -q --allow-empty -F -; }

          s="$work/store/openspec"
          mkdir -p "$s/specs" "$s/changes/ativa-x" "$s/changes/archive/2026-10-08-add-catalogo/specs/catalogo" "$s/changes/archive/2026-10-20-add-busca"
          printf 'schema: spec-driven\ncreated: 2026-10-05\n' > "$s/changes/ativa-x/.openspec.yaml"
          printf '# Proposal\n' > "$s/changes/ativa-x/proposal.md"
          printf '# Tasks\n\n- [x] 1.1 a\n- [ ] 1.2 b\n' > "$s/changes/ativa-x/tasks.md"
          c="$s/changes/archive/2026-10-08-add-catalogo"
          printf 'schema: spec-driven\ncreated: 2026-10-01\n' > "$c/.openspec.yaml"
          printf '# Proposal\n\n## Aprovação\n\n- Responsável: Fulana Silva\n- Data: 2026-10-03\n- Escopo: apply\n- Condições: —\n- Origem: mensagem\n' > "$c/proposal.md"
          printf '# Spec Delta\n\n## ADDED Requirements\n\n### Requirement: A\n\n#### Scenario: a1\n\n#### Scenario: a2\n\n### Requirement: B\n\n#### Scenario: b1\n' > "$c/specs/catalogo/spec.md"
          printf '# Tasks\n\n- [x] 1.1 a\n- [X] 1.2 b\n- [x] 1.3 c\n' > "$c/tasks.md"
          printf '# Verificações — add-catalogo\n\n## 2026-10-07\n\n- Críticos: 1\n- Warnings: 0\n- Sugestões: 0\n- Não verificado: —\n- Avaliação: 1 crítico.\n\n## 2026-10-08\n\n- Críticos: 0\n- Warnings: 2\n- Sugestões: 1\n- Não verificado: CI (sem push)\n- Cobertura fora da suíte: roteiro de navegador (docs/roteiro.md; executado por pessoa)\n- Avaliação: Sem críticos; 2 warnings.\n\nItens:\n\n- [warning] cenário sem teste (`a.js:1`)\n- [warning] design divergente\n- [sugestão] nome de função\n\nComandos:\n\n- `npm test` → 12 passed (exit 0)\n' > "$c/verification.md"
          b="$s/changes/archive/2026-10-20-add-busca"
          printf 'schema: spec-driven\ncreated: 2026-10-15\n' > "$b/.openspec.yaml"
          printf '# Proposal\n' > "$b/proposal.md"
          printf '# Tasks\n\n- [x] 1.1 a\n' > "$b/tasks.md"
          git -C "$work/store" init -q
          git -C "$work/store" add -A
          printf 'chore: store de exemplo\n' | commit "$work/store" 2026-10-01

          k="$work/code"
          git -C "$k" init -q 2>/dev/null || { mkdir -p "$k"; git -C "$k" init -q; }
          printf 'feat: catalogo\n\nOpenSpec-Change: add-catalogo\n' | commit "$k" 2026-10-05
          printf 'fix: ajuste antes do archive\n\nOpenSpec-Change: add-catalogo\n' | commit "$k" 2026-10-07
          printf 'fix: corrige ordenacao\n\nOpenSpec-Change: add-catalogo\n' | commit "$k" 2026-10-10
          printf 'fix(ui): corrige layout\n\nOpenSpec-Change: add-catalogo\n' | commit "$k" 2026-10-11
          printf 'fix: sem trailer\n' | commit "$k" 2026-10-12
          printf 'feat: busca\n\nOpenSpec-Change: add-busca\n' | commit "$k" 2026-10-21

          before_store="$(git -C "$work/store" status --porcelain)"
          before_code="$(git -C "$k" status --porcelain)"
          node scripts/flow-metrics.mjs --store "$work/store" --code "$k" --out "$work/out"
          test "$(git -C "$work/store" status --porcelain)" = "$before_store"
          test "$(git -C "$k" status --porcelain)" = "$before_code"
          test "$(ls "$work/out" | sort | tr '\n' ' ')" = "metrics.csv resumo.md "

          csv="$work/out/metrics.csv"
          head -n 1 "$csv" | sed 's/^\xEF\xBB\xBF//' | grep -qx 'change,estado,criada,aprovada,arquivada,dias_ate_aprovacao,dias_execucao,lead_time_dias,requisitos,cenarios,tarefas,tarefas_concluidas,retrabalho,criticos,warnings,sugestoes,nao_verificados,ci_falhas_antes_do_verde'
          grep -qx 'add-catalogo,arquivada,2026-10-01,2026-10-03,2026-10-08,2,5,7,2,3,3,3,2,0,2,1,1,' "$csv"
          grep -qx 'add-busca,arquivada,2026-10-15,,2026-10-20,,,5,0,0,1,1,0,,,,,' "$csv"
          grep -qx 'ativa-x,ativa,2026-10-05,,,,,,0,0,2,1,,,,,,' "$csv"
          grep -qF '| 2026-10 | 2 | 6 |' "$work/out/resumo.md"
          if grep -riE 'fulana|example\.com' "$work/out"; then exit 1; fi

          # Sem --code: retrabalho vazio e o resumo explica o que não foi coletado.
          node scripts/flow-metrics.mjs --store "$work/store" --out "$work/out-sem-code"
          grep -qx 'add-catalogo,arquivada,2026-10-01,2026-10-03,2026-10-08,2,5,7,2,3,3,3,,0,2,1,1,' "$work/out-sem-code/metrics.csv"
          grep -qi 'não coletado' "$work/out-sem-code/resumo.md"

      # Sessões de exemplo do Claude Code: resposta repetida em duas linhas, atribuição por branch e
      # por janela, registro ambíguo, não atribuído e conteúdo sensível que não pode vazar.
      - name: Smoke test do consumo de IA
        run: |
          work="$(mktemp -d)"
          s="$work/store/openspec/changes"
          mkdir -p "$s/ativa-x" "$s/archive/2026-10-08-add-catalogo" "$s/archive/2026-10-20-add-busca" "$work/code" "$work/sessions"
          printf 'schema: spec-driven\ncreated: 2026-10-05\n' > "$s/ativa-x/.openspec.yaml"
          printf 'schema: spec-driven\ncreated: 2026-10-01\n' > "$s/archive/2026-10-08-add-catalogo/.openspec.yaml"
          printf 'schema: spec-driven\ncreated: 2026-10-15\n' > "$s/archive/2026-10-20-add-busca/.openspec.yaml"
          project="$(node -e 'console.log(require("path").resolve(process.argv[1]).replace(/[^A-Za-z0-9]/g, "-"))' "$work/code")"
          mkdir -p "$work/sessions/$project"
          line() { printf '{"type":"assistant","timestamp":"%sT12:00:00.000Z","gitBranch":"%s","cwd":"/x","message":{"id":"%s","model":"claude-test","content":[{"type":"text","text":"%s"}],"usage":{"input_tokens":%s,"output_tokens":%s,"cache_read_input_tokens":%s,"cache_creation_input_tokens":%s}}}\n' "$@"; }
          {
            line 2026-10-02 feat/add-catalogo m1 bloco-a 10 100 1000 50
            line 2026-10-02 feat/add-catalogo m1 bloco-b 10 100 1000 50
            line 2026-10-03 main m2 resposta 5 50 500 0
            printf '{"type":"user","timestamp":"2026-10-16T11:00:00.000Z","gitBranch":"feat/cliente-acme-add-busca","message":{"role":"user","content":"segredo-xyz"}}\n'
            line 2026-10-16 feat/cliente-acme-add-busca m3 segredo-xyz 1 10 100 0
            line 2026-10-06 main m4 ambigua 2 20 200 0
            line 2026-09-01 main m5 antiga 3 30 300 0
            printf 'linha invalida\n'
          } > "$work/sessions/$project/sessao.jsonl"

          node scripts/flow-metrics.mjs --store "$work/store" --usage "$work/code" --usage-dir "$work/sessions" --out "$work/out"
          u="$work/out/uso-ia.csv"
          head -n 1 "$u" | sed 's/^\xEF\xBB\xBF//' | grep -qx 'change,respostas,tokens_entrada,tokens_saida,tokens_cache_leitura,tokens_cache_escrita'
          grep -qx 'add-catalogo,2,15,150,1500,50' "$u"
          grep -qx 'add-busca,1,1,10,100,0' "$u"
          grep -qx 'ativa-x,0,0,0,0,0' "$u"
          grep -qF 'Respostas ambíguas (mais de uma change possível): 1' "$work/out/resumo.md"
          grep -qF 'Respostas não atribuídas: 1' "$work/out/resumo.md"
          if grep -riE 'segredo-xyz|cliente-acme' "$work/out"; then exit 1; fi

          # Pasta sem sessões: colunas vazias e aviso. Sem --usage: nenhum uso-ia.csv.
          mkdir -p "$work/sem-sessao"
          node scripts/flow-metrics.mjs --store "$work/store" --usage "$work/sem-sessao" --usage-dir "$work/sessions" --out "$work/out-vazio"
          grep -qx 'add-catalogo,,,,,' "$work/out-vazio/uso-ia.csv"
          grep -qF 'Nenhuma sessão encontrada' "$work/out-vazio/resumo.md"
          node scripts/flow-metrics.mjs --store "$work/store" --out "$work/out-sem-usage"
          test ! -e "$work/out-sem-usage/uso-ia.csv"

  # A raiz é espelho gerado de padrao-openspec/ e carrega as changes deste repositório.
  root:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Raiz em dia com padrao-openspec
        run: node padrao-openspec/scripts/sync-root.mjs --check

      # Nunca reinstala por cima: numa máquina com outra suíte rodando, a reinstalação tira o CLI do ar.
      - name: Instalar OpenSpec CLI
        run: |
          if [ "$(openspec --version 2>/dev/null)" = "1.14.2" ]; then
            echo "OpenSpec CLI 1.14.2 já instalado"
          else
            npm install --global @fission-ai/openspec@1.14.2
          fi

      - name: Validar specs e changes OpenSpec da raiz
        run: openspec validate --all --strict

      - name: Lint de Markdown da raiz
        run: npx --yes markdownlint-cli2@0.23.2 "**/*.md"

      # Duas suítes na mesma máquina dividem o registro de stores do OpenSpec: todo id de teste
      # registrado leva um sufixo por execução, e o trap o desregistra.
      - name: Ids de teste com sufixo
        run: |
          test -f .github/workflows/validate.yml
          if grep -nE -- "(--register-id|--id|store unregister)[ =][\"']?ci-[a-z0-9-]+[\"']?([^a-z0-9\$-]|\$)" .github/workflows/validate.yml | grep -vF -- '-$sfx'; then
            echo "::error file=.github/workflows/validate.yml::Id de teste sem o sufixo de execução (\$sfx)"
            exit 1
          fi

      # Guia de quem vai iniciar um projeto: existe, é linkado pelo README e cobre setup e init.
      - name: Guia de primeiros passos
        run: |
          test -f COMECE-AQUI.md
          grep -qF '](COMECE-AQUI.md)' README.md
          grep -qF 'setup-project.mjs' COMECE-AQUI.md
          grep -qF '/opsx:init' COMECE-AQUI.md
          grep -qF 'git clone --branch v' COMECE-AQUI.md
          grep -qF -- '-openspec switch -c main' COMECE-AQUI.md
          # O início de projeto clona a última release, não a main.
          if grep -nE 'git clone https://github\.com/Gilmar1987/PadraoOpenspct' COMECE-AQUI.md README.md padrao-openspec/README.md; then exit 1; fi
          grep -qF '## Primeiros passos' padrao-openspec/templates/openspec-padrao.md
          # A entrada começa pelo script anexado à última release.
          grep -qF 'releases/latest/download/comecar.mjs' COMECE-AQUI.md
          grep -qF 'releases/latest/download/comecar.mjs' README.md
          grep -qF 'releases/latest/download/comecar.mjs' padrao-openspec/templates/openspec-padrao.md
          grep -qF '## Entrar neste projeto' padrao-openspec/templates/openspec-padrao.md
          grep -qF 'padrao-openspec/scripts/comecar.mjs' README.md
