name: Validate

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  # padrao-openspec/ é a fonte única de skills, comandos e agentes, sem stack embutida (ADR-0003).
  # Roda em Linux e em Windows: defeitos de caminho, console e Git aparecem só num dos dois.
  store:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: padrao-openspec
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Instalar OpenSpec CLI
        run: npm install --global @fission-ai/openspec@1.14.2

      - name: Validar specs e changes OpenSpec
        run: openspec validate --all --strict

      # validate --strict não falha quando config.yaml tem regras malformadas; o CLI só avisa
      # e descarta as regras do artefato. Gera as instruções de cada artefato com o config base,
      # falha em qualquer aviso e exige que todas as regras base apareçam nas instruções.
      - name: Config base carrega sem avisos
        run: |
          grep -E '^    - ' openspec/config.yaml | sed -E 's/^    - //; s/^"(.*)"$/\1/' > "$RUNNER_TEMP/base-rules.txt"
          status=0
          for config in openspec/config.yaml; do
            probe="$(mktemp -d)"
            cp -r openspec "$probe/"
            cp "$config" "$probe/openspec/config.yaml"
            mkdir -p "$probe/openspec/changes/ci-config-probe"
            output="$(cd "$probe" && for artifact in proposal specs design tasks; do
              openspec instructions "$artifact" --change ci-config-probe 2>&1
            done)"
            if printf '%s' "$output" | grep -iE "ignoring|invalid '"; then
              echo "::error file=padrao-openspec/$config::OpenSpec ignorou parte da configuração"
              status=1
            fi
            while IFS= read -r rule; do
              if ! printf '%s' "$output" | grep -qF -- "$rule"; then
                echo "::error file=padrao-openspec/$config::Regra do config base ausente: $rule"
                status=1
              fi
            done < "$RUNNER_TEMP/base-rules.txt"
          done
          exit $status

      - name: Lint de Markdown
        run: npx --yes markdownlint-cli2@0.23.2 "**/*.md"

      - name: Sintaxe dos scripts
        run: |
          node --check scripts/install-skills.mjs
          node --check scripts/setup-project.mjs
          node --check scripts/sync-root.mjs
          node --check scripts/changelog-range.mjs
          node --check scripts/comecar.mjs
          # No Windows o Python se chama python e pode não ter o PyYAML.
          py="$(command -v python3 || command -v python)"
          if ! "$py" -c 'import yaml' 2>/dev/null; then
            # Ubuntu protege o Python do sistema (PEP 668); o fallback instala só para o usuário.
            "$py" -m pip install -q 'pyyaml==6.*' || "$py" -m pip install -q --user --break-system-packages 'pyyaml==6.*'
          fi
          "$py" -c 'import sys, yaml; yaml.safe_load(open(sys.argv[1], encoding="utf-8"))' templates/openspec-padrao-update.yml

      # VERSION é a versão do padrão; a primeira seção do CHANGELOG da raiz tem de ser ela,
      # com "O que mudou" e "Ações no projeto" (ADR-0004).
      - name: Versão e changelog
        run: |
          v="$(tr -d '\r\n' < VERSION)"
          if ! printf '%s\n' "$v" | grep -Eqx '[0-9]+\.[0-9]+\.[0-9]+'; then
            echo "::error file=padrao-openspec/VERSION::VERSION não é semver: $v"; exit 1
          fi
          first="$(grep -m1 -E '^## [0-9]+\.[0-9]+\.[0-9]+' ../CHANGELOG.md | sed -E 's/^## ([0-9]+\.[0-9]+\.[0-9]+).*/\1/')"
          if [ "$first" != "$v" ]; then
            echo "::error file=CHANGELOG.md::A primeira versão do CHANGELOG ($first) difere de VERSION ($v)"; exit 1
          fi
          section="$(awk -v head="## $v" 'index($0, head) == 1 {f = 1; next} f && /^## / {exit} f' ../CHANGELOG.md)"
          for title in '### O que mudou' '### Ações no projeto'; do
            if ! printf '%s\n' "$section" | grep -qxF "$title"; then
              echo "::error file=CHANGELOG.md::A seção $v não tem \"$title\""; exit 1
            fi
          done

      - name: Smoke test do changelog-range
        run: |
          f="$RUNNER_TEMP/CHANGELOG.md"
          printf '# Changelog\n\n## 1.2.0 — 2026-11-01\n\n### O que mudou\n\n- c\n\n### Ações no projeto\n\n- Acrescentar X ao project.md\n\n## 1.1.0 — 2026-10-25\n\n### O que mudou\n\n- b\n\n### Ações no projeto\n\n- Nenhuma\n\n## 1.0.0 — 2026-10-20\n\n### O que mudou\n\n- a\n\n### Ações no projeto\n\n- Nenhuma\n' > "$f"
          out="$(node scripts/changelog-range.mjs --file "$f" --from 1.0.0 --to v1.2.0)"
          printf '%s\n' "$out" | grep -q '^## 1\.2\.0'
          printf '%s\n' "$out" | grep -q '^## 1\.1\.0'
          if printf '%s\n' "$out" | grep -q '^## 1\.0\.0'; then exit 1; fi
          acts="$(node scripts/changelog-range.mjs --file "$f" --from v1.0.0 --to 1.2.0 --actions)"
          printf '%s\n' "$acts" | grep -qF 'Acrescentar X ao project.md'
          if printf '%s\n' "$acts" | grep -q 'Nenhuma'; then exit 1; fi
          test -z "$(node scripts/changelog-range.mjs --file "$f" --from 1.2.0 --to 1.2.0)"
          if node scripts/changelog-range.mjs --file "$f" --from 1.0.0 --to 9.9.9; then exit 1; fi

      # Skills e comandos gerados pelo OpenSpec CLI levam trechos customizados do padrão;
      # regenerá-los apaga esses trechos. A checagem falha se algum deles sumir.
      - name: Trechos customizados das skills
        run: |
          missing=0
          check() {
            if ! grep -qF -- "$2" "$1"; then
              echo "::error file=padrao-openspec/$1::Trecho customizado ausente: $2"
              missing=1
            fi
          }
          for f in .claude/commands/opsx/propose.md .claude/skills/openspec-propose/SKILL.md; do
            check "$f" "Architectural Decision Check"
            check "$f" "Prior authorization exception"
            check "$f" "Standard version check"
            check "$f" "offer to update now"
            check "$f" "Commit the planning"
          done
          for f in .claude/commands/opsx/apply.md .claude/skills/openspec-apply-change/SKILL.md; do
            check "$f" "Check the approval record"
            check "$f" "OpenSpec-Change:"
            check "$f" "Confirm progress per task group"
            check "$f" "Standard version check"
            check "$f" "offer to update now"
            check "$f" "Record task evidence"
            check "$f" "Push only on explicit request"
            check "$f" "Security checks"
            check "$f" "Request code review"
          done
          for f in .claude/commands/opsx/verify.md .claude/skills/openspec-verify-change/SKILL.md; do
            check "$f" "Write the verification record"
            check "$f" "Evidence reuse"
            check "$f" "Standard version check"
            check "$f" "offer to update now"
            check "$f" "Cobertura fora da suíte"
            check "$f" "Project validation commands"
            check "$f" "Code review record"
          done
          for f in .claude/commands/opsx/archive.md .claude/skills/openspec-archive-change/SKILL.md; do
            check "$f" "Update the project overview"
            check "$f" "Standard version check"
            check "$f" "offer to update now"
            check "$f" "Check the archive authorization"
            check "$f" "Commit the archive"
          done
          # Entrevista do init: documento de arquitetura, idioma do código, fila por banco e E2E acrescentado.
          f=.claude/commands/opsx/init.md
          check "$f" "Commit the init"
          check "$f" '### Arquivo 5: `<root>/openspec/arquitetura.md`'
          check "$f" "flowchart LR"
          check "$f" "ou de Development Conventions"
          check "$f" "3.8 cita uma biblioteca presa"
          check "$f" "**7.3 — Em que idioma o código será escrito"
          check "$f" "Fila no próprio banco"
          check "$f" 'acrescente ao `operations.apply.guidance`'
          exit $missing

      - name: Smoke test do instalador
        run: |
          consumer="$(mktemp -d)"
          git -C "$consumer" init -q
          node scripts/install-skills.mjs "$consumer" --target both
          # O conteúdo local de openspec/ fica ignorado; a declaração do store (config.yaml) vai para o git.
          git -C "$consumer" check-ignore -q openspec/changes/demo/proposal.md
          if git -C "$consumer" check-ignore -q openspec/config.yaml; then exit 1; fi
          test ! -e "$consumer/.agents/skills/dotnet-implementation"
          test ! -e "$consumer/.agents/skills/nextjs-implementation"
          node scripts/install-skills.mjs "$consumer" --target both | grep -q '^Done\. 0 installed'
          test "$(grep -cx '/openspec/\*' "$consumer/.gitignore")" -eq 1
          test "$(grep -cx '!/openspec/config.yaml' "$consumer/.gitignore")" -eq 1
          # Migração do bloco antigo, que ignorava /openspec/ inteiro.
          legacy="$(mktemp -d)"
          git -C "$legacy" init -q
          printf 'node_modules/\n# OpenSpec planning artifacts are maintained in the separate planning store.\n/openspec/\n' > "$legacy/.gitignore"
          node scripts/install-skills.mjs "$legacy" --target agents
          test "$(grep -cx '/openspec/' "$legacy/.gitignore")" -eq 0
          test "$(grep -cx '/openspec/\*' "$legacy/.gitignore")" -eq 1
          grep -qx 'node_modules/' "$legacy/.gitignore"
          if git -C "$legacy" check-ignore -q openspec/config.yaml; then exit 1; fi
          # --stack foi removido (ADR-0003): recusado antes de qualquer cópia.
          stackless="$(mktemp -d)"
          git -C "$stackless" init -q
          if node scripts/install-skills.mjs "$stackless" --stack dotnet 2> "$RUNNER_TEMP/stack-err.txt"; then exit 1; fi
          grep -qF -- '--stack was removed' "$RUNNER_TEMP/stack-err.txt"
          test ! -e "$stackless/.agents"
          test ! -e "$stackless/.claude"
          test ! -e "$stackless/.gitignore"
          # Comandos OPSX instalados idênticos à fonte, incluindo init e ingest.
          diff -r .claude/commands/opsx "$consumer/.claude/commands/opsx"
          test -f "$consumer/.claude/commands/opsx/init.md"
          test -f "$consumer/.claude/commands/opsx/ingest.md"
          grep -q 'Architectural Decision Check' "$consumer/.claude/commands/opsx/propose.md"
          for skill in docker requesting-code-review versioning-ci-cd; do
            test -f "$consumer/.agents/skills/$skill/SKILL.md"
          done
          # Comando customizado no consumidor: sem --force nada é copiado.
          echo customizado >> "$consumer/.claude/commands/opsx/propose.md"
          if node scripts/install-skills.mjs "$consumer"; then exit 1; fi
          grep -q '^customizado$' "$consumer/.claude/commands/opsx/propose.md"
          # Sem --target, as skills vão para .agents/skills e .claude/skills.
          default="$(mktemp -d)"
          git -C "$default" init -q
          node scripts/install-skills.mjs "$default"
          test -f "$default/.agents/skills/openspec-propose/SKILL.md"
          test -f "$default/.claude/skills/openspec-propose/SKILL.md"
          cmp .claude/skills/openspec-propose/SKILL.md "$default/.claude/skills/openspec-propose/SKILL.md"
          # --target agents não cria .claude/skills, mas instala os comandos.
          agents_only="$(mktemp -d)"
          git -C "$agents_only" init -q
          node scripts/install-skills.mjs "$agents_only" --target agents
          test ! -e "$agents_only/.claude/skills"
          test -f "$agents_only/.claude/commands/opsx/init.md"
          # Nenhuma skill externa é recomendada nem instalada.
          rec_none="$(mktemp -d)"
          git -C "$rec_none" init -q
          node scripts/install-skills.mjs "$rec_none" > "$RUNNER_TEMP/rec-none.txt"
          if grep -q 'npx skills add' "$RUNNER_TEMP/rec-none.txt"; then exit 1; fi
          # Manifesto, workflow e guia de atualização chegam na primeira instalação (ADR-0004).
          man="$(mktemp -d)"
          git -C "$man" init -q -b main
          node scripts/install-skills.mjs "$man" > /dev/null
          test -f "$man/.github/workflows/openspec-padrao-update.yml"
          test -f "$man/docs/openspec-padrao.md"
          node -e '
            const m = JSON.parse(require("fs").readFileSync(process.argv[1] + "/.openspec-padrao.json", "utf8"));
            const v = require("fs").readFileSync("VERSION", "utf8").trim();
            const need = [".claude/commands/opsx/apply.md", ".github/workflows/openspec-padrao-update.yml", "docs/openspec-padrao.md"];
            if (m.version !== v || m.target !== "both" || !need.every((f) => m.managedFiles.includes(f))) process.exit(1);
          ' "$man"
          # Reinstalação sem mudança passa sem modo.
          node scripts/install-skills.mjs "$man" | grep -q '^Done\. 0 installed'
          git -C "$man" add -A
          git -C "$man" -c user.name=ci -c user.email=ci@example.invalid commit -qm base
          # Arquivo extra numa pasta de skill não conta como mudança.
          printf 'extra\n' > "$man/.claude/skills/openspec-propose/extra.md"
          git -C "$man" add -A
          git -C "$man" -c user.name=ci -c user.email=ci@example.invalid commit -qm extra
          node scripts/install-skills.mjs "$man" | grep -q '^Done\. 0 installed'
          test -z "$(git -C "$man" status --porcelain)"
          # Versão nova da fonte (cópia com um comando alterado): sem modo, recusa sem mudar nada.
          src="$(mktemp -d)/padrao-openspec"
          cp -r . "$src"
          printf '1.0.1\n' > "$src/VERSION"
          printf '\nlinha nova\n' >> "$src/.claude/commands/opsx/apply.md"
          if node "$src/scripts/install-skills.mjs" "$man" 2> "$RUNNER_TEMP/mode-err.txt"; then exit 1; fi
          grep -qF -- '--update' "$RUNNER_TEMP/mode-err.txt"
          grep -qF -- '--in-place' "$RUNNER_TEMP/mode-err.txt"
          test -z "$(git -C "$man" status --porcelain)"
          # --update com alteração pendente: recusa sem mudar nada.
          printf 'pendente\n' > "$man/rascunho.txt"
          if node "$src/scripts/install-skills.mjs" "$man" --update; then exit 1; fi
          test "$(git -C "$man" branch --show-current)" = main
          if grep -q 'linha nova' "$man/.claude/commands/opsx/apply.md"; then exit 1; fi
          rm "$man/rascunho.txt"
          # --update limpo: branch própria com um commit; a main não muda.
          before="$(git -C "$man" rev-parse main)"
          GIT_AUTHOR_NAME=ci GIT_AUTHOR_EMAIL=ci@example.invalid GIT_COMMITTER_NAME=ci GIT_COMMITTER_EMAIL=ci@example.invalid \
            node "$src/scripts/install-skills.mjs" "$man" --update
          test "$(git -C "$man" branch --show-current)" = chore/padrao-v1.0.1
          test "$(git -C "$man" rev-parse main)" = "$before"
          test -z "$(git -C "$man" status --porcelain)"
          git -C "$man" log -1 --format=%s | grep -qx 'chore: atualiza padrão OpenSpec para v1.0.1'
          grep -q 'linha nova' "$man/.claude/commands/opsx/apply.md"
          node -e 'process.exit(JSON.parse(require("fs").readFileSync(process.argv[1] + "/.openspec-padrao.json", "utf8")).version === "1.0.1" ? 0 : 1)' "$man"
          # Falha no meio do --update (hook de pre-commit): volta à branch original, sem branch nova nem sujeira.
          tx="$(mktemp -d)"
          git -C "$tx" init -q -b main
          node scripts/install-skills.mjs "$tx" > /dev/null
          git -C "$tx" add -A
          git -C "$tx" -c user.name=ci -c user.email=ci@example.invalid commit -qm base
          printf '#!/bin/sh\nexit 1\n' > "$tx/.git/hooks/pre-commit"
          chmod +x "$tx/.git/hooks/pre-commit"
          if GIT_AUTHOR_NAME=ci GIT_AUTHOR_EMAIL=ci@example.invalid GIT_COMMITTER_NAME=ci GIT_COMMITTER_EMAIL=ci@example.invalid \
            node "$src/scripts/install-skills.mjs" "$tx" --update; then exit 1; fi
          test "$(git -C "$tx" branch --show-current)" = main
          if git -C "$tx" rev-parse --verify --quiet refs/heads/chore/padrao-v1.0.1; then exit 1; fi
          test -z "$(git -C "$tx" status --porcelain)"
          rm "$tx/.git/hooks/pre-commit"
          # Só a versão mudou: regravar o manifesto também exige modo.
          src_v="$(mktemp -d)/padrao-openspec"
          cp -r . "$src_v"
          printf '1.0.2\n' > "$src_v/VERSION"
          if node "$src_v/scripts/install-skills.mjs" "$tx"; then exit 1; fi
          test -z "$(git -C "$tx" status --porcelain)"
          # --in-place grava na branch atual, sem commit.
          node "$src/scripts/install-skills.mjs" "$tx" --in-place > /dev/null
          test "$(git -C "$tx" branch --show-current)" = main
          grep -q 'linha nova' "$tx/.claude/commands/opsx/apply.md"
          test -n "$(git -C "$tx" status --porcelain)"
          node -e 'process.exit(JSON.parse(require("fs").readFileSync(process.argv[1] + "/.openspec-padrao.json", "utf8")).version === "1.0.1" ? 0 : 1)' "$tx"

      - name: Smoke test do setup de projeto
        run: |
          work="$(mktemp -d)"
          cp -r . "$work/store"
          # A cópia de padrao-openspec/ não leva o .git da raiz; o commit permite ao setup
          # reconhecer project.md e config.yaml intactos e não gerar backups .bak.
          git -C "$work/store" init -q
          git -C "$work/store" add -A
          git -C "$work/store" -c user.name=ci -c user.email=ci@example.invalid commit -qm base
          mkdir "$work/code"
          git -C "$work/code" init -q
          # Sem preset (ADR-0003): o setup só grava o nome do projeto; o config.yaml continua neutro.
          node "$work/store/scripts/setup-project.mjs" "$work/code" --name "CI Project" --yes
          cmp "$work/store/openspec/config.yaml" openspec/config.yaml
          head -n 1 "$work/store/openspec/project.md" | grep -q '^# CI Project '
          test "$(sed 1d "$work/store/openspec/project.md")" = "$(sed 1d openspec/project.md)"
          test ! -e "$work/code/.agents/skills/dotnet-implementation"
          test ! -e "$work/code/.agents/skills/nextjs-implementation"
          test -z "$(find "$work/store/openspec" -maxdepth 1 -name '*.bak')"
          # --stack foi removido: o setup recusa antes de alterar o store ou o código.
          before="$(cat "$work/store/openspec/project.md")"
          fresh="$(mktemp -d)"
          git -C "$fresh" init -q
          if node "$work/store/scripts/setup-project.mjs" "$fresh" --stack nextjs --yes 2> "$RUNNER_TEMP/setup-stack-err.txt"; then exit 1; fi
          grep -qF -- '--stack was removed' "$RUNNER_TEMP/setup-stack-err.txt"
          test "$(cat "$work/store/openspec/project.md")" = "$before"
          test ! -e "$fresh/.agents"

      # Fluxo recomendado: o store é uma subpasta (padrao-openspec/) de um repositório git.
      # Sem --name, o setup não altera project.md nem config.yaml.
      - name: Smoke test do setup em subpasta
        run: |
          work="$(mktemp -d)"
          mkdir -p "$work/repo" "$work/code"
          cp -r . "$work/repo/padrao-openspec"
          git -C "$work/repo" init -q
          git -C "$work/repo" add -A
          git -C "$work/repo" -c user.name=ci -c user.email=ci@example.invalid commit -qm base
          git -C "$work/code" init -q
          node "$work/repo/padrao-openspec/scripts/setup-project.mjs" "$work/code" --no-register --yes
          test -z "$(git -C "$work/repo" status --porcelain -- padrao-openspec/openspec)"
          test -f "$work/code/.claude/commands/opsx/init.md"

      # Store clonado do padrão: o origin é renomeado para "padrao", para que um push no store
      # não publique os artefatos do projeto no repositório do padrão.
      - name: Smoke test do remote do padrão
        run: |
          prepare() {
            local dir="$1" url="$2"
            mkdir -p "$dir/repo" "$dir/code"
            cp -r . "$dir/repo/padrao-openspec"
            git -C "$dir/repo" init -q
            git -C "$dir/code" init -q
            if [ -n "$url" ]; then git -C "$dir/repo" remote add origin "$url"; fi
          }
          work="$(mktemp -d)"
          prepare "$work/padrao" https://github.com/Gilmar1987/PadraoOpenspct.git
          node "$work/padrao/repo/padrao-openspec/scripts/setup-project.mjs" "$work/padrao/code" --no-register --yes > "$RUNNER_TEMP/remote.txt"
          test "$(git -C "$work/padrao/repo" remote)" = "padrao"
          grep -qF 'remote add origin' "$RUNNER_TEMP/remote.txt"
          grep -qF 'remote rename padrao origin' "$RUNNER_TEMP/remote.txt"
          # --keep-origin mantém o origin.
          prepare "$work/keep" https://github.com/Gilmar1987/PadraoOpenspct
          node "$work/keep/repo/padrao-openspec/scripts/setup-project.mjs" "$work/keep/code" --no-register --keep-origin --yes
          test "$(git -C "$work/keep/repo" remote)" = "origin"
          # origin de outro repositório: nada muda.
          prepare "$work/proprio" https://github.com/acme/livraria-openspec.git
          node "$work/proprio/repo/padrao-openspec/scripts/setup-project.mjs" "$work/proprio/code" --no-register --yes
          test "$(git -C "$work/proprio/repo" remote)" = "origin"

      - name: Smoke test da declaração do store
        run: |
          work="$(mktemp -d)"
          cp -r . "$work/store"
          mkdir "$work/code"
          git -C "$work/code" init -q
          node "$work/store/scripts/setup-project.mjs" "$work/code" --name "CI Store" --register-id ci-store --yes
          grep -qx 'store: ci-store' "$work/code/openspec/config.yaml"
          # Os dois caminhos passam pelo Node para ficarem no mesmo formato também no Windows.
          resolved="$(cd "$work/code" && openspec context --json | node -e 'let d="";process.stdin.on("data",c=>d+=c).on("end",()=>console.log(require("fs").realpathSync(JSON.parse(d).root.path)))')"
          expected="$(cd "$work/store" && node -p 'require("fs").realpathSync(process.cwd())')"
          test "$resolved" = "$expected"
          # Declaração conflitante: o setup recusa sem --force e não altera o arquivo.
          mkdir -p "$work/other/openspec"
          git -C "$work/other" init -q
          printf 'store: outro\n' > "$work/other/openspec/config.yaml"
          if node "$work/store/scripts/setup-project.mjs" "$work/other" --register-id ci-store --yes; then exit 1; fi
          grep -qx 'store: outro' "$work/other/openspec/config.yaml"
          # Com --force, a declaração existente é substituída e o store volta a ser resolvido.
          node "$work/store/scripts/setup-project.mjs" "$work/other" --register-id ci-store --force --yes
          grep -qx 'store: ci-store' "$work/other/openspec/config.yaml"
          test "$(grep -c '^store:' "$work/other/openspec/config.yaml")" -eq 1

      # Script de entrada (comecar.mjs) contra um padrão local com tags: projeto novo com um
      # único clone na última release, entrada num projeto em andamento e as recusas.
      - name: Smoke test do script de entrada
        run: |
          trap 'for id in ci-entrada ci-semcommit ci-semident; do openspec store unregister "$id" >/dev/null 2>&1 || true; done' EXIT
          # O script faz o commit inicial; o runner não tem identidade Git configurada.
          export GIT_AUTHOR_NAME=ci GIT_AUTHOR_EMAIL=ci@example.invalid GIT_COMMITTER_NAME=ci GIT_COMMITTER_EMAIL=ci@example.invalid
          work="$(mktemp -d)"
          v="$(tr -d '\r\n' < VERSION)"
          commit() { git -C "$1" -c user.name=ci -c user.email=ci@example.invalid commit -q "${@:2}"; }
          mkdir -p "$work/padrao"
          cp -r . "$work/padrao/padrao-openspec"
          git -C "$work/padrao" init -q
          git -C "$work/padrao" add -A
          commit "$work/padrao" -m base
          git -C "$work/padrao" tag v1.0.0
          commit "$work/padrao" --allow-empty -m next
          git -C "$work/padrao" tag "v$v"
          # Projeto novo: store na última tag, na branch main, e código ligado a ele.
          node scripts/comecar.mjs --origem "$work/padrao" --modo novo --pasta "$work/a" --nome "CI Entrada" --id ci-entrada --yes > "$RUNNER_TEMP/novo.txt"
          store="$work/a/ci-entrada-openspec"
          code="$work/a/ci-entrada"
          test "$(git -C "$store" branch --show-current)" = main
          # O commit de configuração fica por cima da tag da release clonada.
          test "$(git -C "$store" describe --tags --abbrev=0)" = "v$v"
          test -f "$code/.claude/commands/opsx/init.md"
          grep -qx 'store: ci-entrada' "$code/openspec/config.yaml"
          grep -qF '/opsx:init' "$RUNNER_TEMP/novo.txt"
          grep -qF 'pasta do workspace' "$RUNNER_TEMP/novo.txt"
          # Commit inicial: um commit no código, o de configuração no store, as duas árvores limpas.
          test "$(git -C "$code" rev-list --count HEAD)" -eq 1
          git -C "$store" log -1 --format=%s | grep -qF 'configura o store'
          test -z "$(git -C "$code" status --porcelain)"
          test -z "$(git -C "$store" status --porcelain)"
          grep -qF 'Commit inicial' "$RUNNER_TEMP/novo.txt"
          # A pasta do projeto já existe: recusa sem alterar nada.
          before="$(git -C "$store" status --porcelain)"
          if node scripts/comecar.mjs --origem "$work/padrao" --modo novo --pasta "$work/a" --nome "CI Entrada" --id ci-entrada --yes; then exit 1; fi
          test "$(git -C "$store" status --porcelain)" = "$before"
          # Sem terminal, uma resposta que falta para com a opção que a informa.
          if node scripts/comecar.mjs --origem "$work/padrao" --modo novo --pasta "$work/c" --id ci-falta --yes < /dev/null 2> "$RUNNER_TEMP/falta.txt"; then exit 1; fi
          grep -qF 'Falta --nome' "$RUNNER_TEMP/falta.txt"
          test ! -e "$work/c/ci-falta-openspec"
          # Id já registrado nesta máquina: recusa antes do resumo, sem criar pastas.
          if node scripts/comecar.mjs --origem "$work/padrao" --modo novo --pasta "$work/e" --nome "CI Entrada" --id ci-entrada --yes 2> "$RUNNER_TEMP/registrado.txt"; then exit 1; fi
          grep -qF 'openspec store unregister ci-entrada' "$RUNNER_TEMP/registrado.txt"
          test ! -e "$work/e"
          # Com --sem-commit, o código fica sem histórico e a mensagem mostra como commitar.
          node scripts/comecar.mjs --origem "$work/padrao" --modo novo --pasta "$work/f" --nome "CI Sem Commit" --id ci-semcommit --yes --sem-commit > "$RUNNER_TEMP/semcommit.txt"
          if git -C "$work/f/ci-semcommit" rev-parse -q --verify HEAD; then exit 1; fi
          grep -qF 'git -C' "$RUNNER_TEMP/semcommit.txt"
          openspec store unregister ci-semcommit
          # Sem identidade Git: o script avisa, mostra os comandos e termina com código zero.
          GIT_CONFIG_GLOBAL=/dev/null GIT_AUTHOR_NAME= GIT_COMMITTER_NAME= GIT_AUTHOR_EMAIL= GIT_COMMITTER_EMAIL= \
            node scripts/comecar.mjs --origem "$work/padrao" --modo novo --pasta "$work/g" --nome "CI Sem Ident" --id ci-semident --yes > "$RUNNER_TEMP/semident.txt" 2>&1
          grep -qF 'não consegui fazer o commit inicial' "$RUNNER_TEMP/semident.txt"
          if git -C "$work/g/ci-semident" rev-parse -q --verify HEAD; then exit 1; fi
          openspec store unregister ci-semident
          # Projeto em andamento: publica os dois repositórios e entra por outra pasta.
          git -C "$code" add -A
          git -C "$code" diff --cached --quiet || commit "$code" -m setup
          git -C "$store" add -A
          git -C "$store" diff --cached --quiet || commit "$store" -m init
          mkdir "$work/remotos"
          git clone -q --bare "$code" "$work/remotos/ci-entrada.git"
          git clone -q --bare "$store" "$work/remotos/ci-entrada-openspec.git"
          openspec store unregister ci-entrada
          node scripts/comecar.mjs --modo existente --pasta "$work/b" --url-codigo "$work/remotos/ci-entrada.git" --url-store "$work/remotos/ci-entrada-openspec.git" --yes > "$RUNNER_TEMP/existente.txt"
          # Os dois caminhos passam pelo Node para ficarem no mesmo formato também no Windows.
          resolved="$(cd "$work/b/ci-entrada" && openspec context --json | node -e 'let d="";process.stdin.on("data",c=>d+=c).on("end",()=>console.log(require("fs").realpathSync(JSON.parse(d).root.path)))')"
          expected="$(cd "$work/b/ci-entrada-openspec/padrao-openspec" && node -p 'require("fs").realpathSync(process.cwd())')"
          test "$resolved" = "$expected"
          grep -qF '/opsx:propose' "$RUNNER_TEMP/existente.txt"
          grep -qF 'pasta do workspace' "$RUNNER_TEMP/existente.txt"
          grep -qF 'não rode /opsx:init' "$RUNNER_TEMP/existente.txt"
          # Código sem a linha store: recusa sem registrar nada.
          mkdir "$work/sem-store"
          git -C "$work/sem-store" init -q
          commit "$work/sem-store" --allow-empty -m vazio
          git clone -q --bare "$work/sem-store" "$work/remotos/sem-store.git"
          registered="$(openspec store list --json)"
          if node scripts/comecar.mjs --modo existente --pasta "$work/d" --url-codigo "$work/remotos/sem-store.git" --url-store "$work/remotos/ci-entrada-openspec.git" --yes 2> "$RUNNER_TEMP/sem-store.txt"; then exit 1; fi
          grep -qF 'store:' "$RUNNER_TEMP/sem-store.txt"
          test "$(openspec store list --json)" = "$registered"
          openspec store unregister ci-entrada

      # No Windows, a pasta base digitada com o drive em minúscula (c:\...) não pode virar um falso
      # "not this store": o CLI devolve C:\..., e a comparação tem de reconhecer a mesma pasta.
      # O %TEMP% do runner fica em c:\Users\RUNNER~1, então o passo cobre também o nome curto 8.3.
      - name: Smoke test do drive minúsculo
        if: runner.os == 'Windows'
        run: |
          trap 'openspec store unregister ci-drive >/dev/null 2>&1 || true' EXIT
          work="$(mktemp -d)"
          v="$(tr -d '\r\n' < VERSION)"
          commit() { git -C "$1" -c user.name=ci -c user.email=ci@example.invalid commit -q "${@:2}"; }
          mkdir -p "$work/padrao"
          cp -r . "$work/padrao/padrao-openspec"
          # O .gitattributes da raiz mantém LF no repositório temporário, como no checkout.
          cp ../.gitattributes "$work/padrao/"
          git -C "$work/padrao" init -q
          git -C "$work/padrao" add -A
          commit "$work/padrao" -m base
          git -C "$work/padrao" tag "v$v"
          low="$(cygpath -w "$work" | sed -E 's/^([A-Za-z]):/\L\1:/')"
          node scripts/comecar.mjs --origem "$work/padrao" --modo novo --pasta "$low\a" --nome "CI Drive" --id ci-drive --yes
          git -C "$work/a/ci-drive" add -A
          git -C "$work/a/ci-drive" diff --cached --quiet || commit "$work/a/ci-drive" -m setup
          git -C "$work/a/ci-drive-openspec" add -A
          git -C "$work/a/ci-drive-openspec" diff --cached --quiet || commit "$work/a/ci-drive-openspec" -m init
          mkdir "$work/remotos"
          git clone -q --bare "$work/a/ci-drive" "$work/remotos/ci-drive.git"
          git clone -q --bare "$work/a/ci-drive-openspec" "$work/remotos/ci-drive-openspec.git"
          openspec store unregister ci-drive
          node scripts/comecar.mjs --modo existente --pasta "$low\b" --url-codigo "$work/remotos/ci-drive.git" --url-store "$work/remotos/ci-drive-openspec.git" --yes
          resolved="$(cd "$work/b/ci-drive" && openspec context --json | node -e 'let d="";process.stdin.on("data",c=>d+=c).on("end",()=>console.log(require("fs").realpathSync.native(JSON.parse(d).root.path)))')"
          expected="$(cd "$work/b/ci-drive-openspec/padrao-openspec" && node -p 'require("fs").realpathSync.native(process.cwd())')"
          test "$resolved" = "$expected"
          openspec store unregister ci-drive

      # Regras do padrão entregues ao código por blocos gerenciados (ADR-0005): o conteúdo fora dos
      # marcadores fica intacto, a reinstalação não duplica e um bloco quebrado faz o instalador parar.
      - name: Smoke test dos blocos de agentes
        run: |
          # O --update do instalador faz commit; o runner não tem identidade Git configurada.
          export GIT_AUTHOR_NAME=ci GIT_AUTHOR_EMAIL=ci@example.invalid GIT_COMMITTER_NAME=ci GIT_COMMITTER_EMAIL=ci@example.invalid
          work="$(mktemp -d)"
          commit() { git -C "$1" -c user.name=ci -c user.email=ci@example.invalid commit -q "${@:2}"; }
          code="$work/code"
          mkdir -p "$code"
          git -C "$code" init -q
          printf '<!-- BEGIN:nextjs-agent-rules -->\nregras do next\n<!-- END:nextjs-agent-rules -->\n' > "$code/AGENTS.md"
          cp "$code/AGENTS.md" "$work/next-block.txt"
          node scripts/install-skills.mjs "$code"
          head -n 3 "$code/AGENTS.md" | cmp - "$work/next-block.txt"
          for f in AGENTS.md CLAUDE.md GEMINI.md .github/copilot-instructions.md .amazonq/rules/openspec-padrao.md; do
            test "$(grep -c '<!-- BEGIN:openspec-padrao -->' "$code/$f")" -eq 1
            test "$(grep -c '<!-- END:openspec-padrao -->' "$code/$f")" -eq 1
          done
          grep -qx '@AGENTS.md' "$code/CLAUDE.md"
          grep -qF 'docs/openspec-regras.md' "$code/AGENTS.md"
          cmp "$code/docs/openspec-regras.md" openspec/rules.md
          grep -qF '"docs/openspec-regras.md"' "$code/.openspec-padrao.json"
          grep -qF '"managedBlocks"' "$code/.openspec-padrao.json"
          # Segunda instalação da mesma versão: os arquivos de instrução não mudam.
          before="$(cat "$code/AGENTS.md" "$code/CLAUDE.md" "$code/GEMINI.md")"
          node scripts/install-skills.mjs "$code"
          test "$(cat "$code/AGENTS.md" "$code/CLAUDE.md" "$code/GEMINI.md")" = "$before"
          # Bloco de uma versão anterior: exige um modo; com --update, um só bloco, no commit.
          git -C "$code" add -A
          commit "$code" -m base
          perl -0pi -e 's/(<!-- BEGIN:openspec-padrao -->).*?(<!-- END:openspec-padrao -->)/$1\ntexto antigo\n$2/s' "$code/AGENTS.md"
          git -C "$code" add -A
          commit "$code" -m antigo
          if node scripts/install-skills.mjs "$code"; then exit 1; fi
          grep -qF 'texto antigo' "$code/AGENTS.md"
          node scripts/install-skills.mjs "$code" --update
          test "$(grep -c '<!-- BEGIN:openspec-padrao -->' "$code/AGENTS.md")" -eq 1
          if grep -qF 'texto antigo' "$code/AGENTS.md"; then exit 1; fi
          head -n 3 "$code/AGENTS.md" | cmp - "$work/next-block.txt"
          git -C "$code" show --stat --format= HEAD | grep -qF 'AGENTS.md'
          # Arquivo de instrução ignorado pelo projeto: não é criado, e o --update funciona.
          ignored="$work/ignored"
          mkdir -p "$ignored"
          git -C "$ignored" init -q
          printf 'CLAUDE.md\n' > "$ignored/.gitignore"
          git -C "$ignored" add -A
          commit "$ignored" -m base
          node scripts/install-skills.mjs "$ignored" --update > "$RUNNER_TEMP/blocos-ignored.txt"
          grep -qF 'Skipped: CLAUDE.md' "$RUNNER_TEMP/blocos-ignored.txt"
          test ! -e "$ignored/CLAUDE.md"
          git -C "$ignored" show --stat --format= HEAD | grep -qF 'AGENTS.md'
          # BEGIN sem END: o instalador para antes de alterar qualquer arquivo.
          broken="$work/broken"
          mkdir -p "$broken"
          git -C "$broken" init -q
          printf 'conteúdo do projeto\n<!-- BEGIN:openspec-padrao -->\nsem fim\n' > "$broken/AGENTS.md"
          cp "$broken/AGENTS.md" "$work/broken-before.txt"
          if node scripts/install-skills.mjs "$broken" 2> "$RUNNER_TEMP/blocos-err.txt"; then exit 1; fi
          grep -qF 'openspec-padrao' "$RUNNER_TEMP/blocos-err.txt"
          cmp "$broken/AGENTS.md" "$work/broken-before.txt"
          test ! -e "$broken/.claude"

      # Store e repositório de código de exemplo com datas conhecidas e autor fictício:
      # confere o CSV linha a linha, o resumo, a ausência de dados pessoais e que nada muda.
      - name: Smoke test das métricas de fluxo
        run: |
          work="$(mktemp -d)"
          export GIT_AUTHOR_NAME="Fulana Silva" GIT_AUTHOR_EMAIL="fulana@example.com"
          export GIT_COMMITTER_NAME="Fulana Silva" GIT_COMMITTER_EMAIL="fulana@example.com"
          commit() { GIT_AUTHOR_DATE="$2T12:00:00" GIT_COMMITTER_DATE="$2T12:00:00" git -C "$1" commit -q --allow-empty -F -; }

          s="$work/store/openspec"
          mkdir -p "$s/specs" "$s/changes/ativa-x" "$s/changes/archive/2026-10-08-add-catalogo/specs/catalogo" "$s/changes/archive/2026-10-20-add-busca"
          printf 'schema: spec-driven\ncreated: 2026-10-05\n' > "$s/changes/ativa-x/.openspec.yaml"
          printf '# Proposal\n' > "$s/changes/ativa-x/proposal.md"
          printf '# Tasks\n\n- [x] 1.1 a\n- [ ] 1.2 b\n' > "$s/changes/ativa-x/tasks.md"
          c="$s/changes/archive/2026-10-08-add-catalogo"
          printf 'schema: spec-driven\ncreated: 2026-10-01\n' > "$c/.openspec.yaml"
          printf '# Proposal\n\n## Aprovação\n\n- Responsável: Fulana Silva\n- Data: 2026-10-03\n- Escopo: apply\n- Condições: —\n- Origem: mensagem\n' > "$c/proposal.md"
          printf '# Spec Delta\n\n## ADDED Requirements\n\n### Requirement: A\n\n#### Scenario: a1\n\n#### Scenario: a2\n\n### Requirement: B\n\n#### Scenario: b1\n' > "$c/specs/catalogo/spec.md"
          printf '# Tasks\n\n- [x] 1.1 a\n- [X] 1.2 b\n- [x] 1.3 c\n' > "$c/tasks.md"
          printf '# Verificações — add-catalogo\n\n## 2026-10-07\n\n- Críticos: 1\n- Warnings: 0\n- Sugestões: 0\n- Não verificado: —\n- Avaliação: 1 crítico.\n\n## 2026-10-08\n\n- Críticos: 0\n- Warnings: 2\n- Sugestões: 1\n- Não verificado: CI (sem push)\n- Cobertura fora da suíte: roteiro de navegador (docs/roteiro.md; executado por pessoa)\n- Avaliação: Sem críticos; 2 warnings.\n\nItens:\n\n- [warning] cenário sem teste (`a.js:1`)\n- [warning] design divergente\n- [sugestão] nome de função\n\nComandos:\n\n- `npm test` → 12 passed (exit 0)\n' > "$c/verification.md"
          b="$s/changes/archive/2026-10-20-add-busca"
          printf 'schema: spec-driven\ncreated: 2026-10-15\n' > "$b/.openspec.yaml"
          printf '# Proposal\n' > "$b/proposal.md"
          printf '# Tasks\n\n- [x] 1.1 a\n' > "$b/tasks.md"
          git -C "$work/store" init -q
          git -C "$work/store" add -A
          printf 'chore: store de exemplo\n' | commit "$work/store" 2026-10-01

          k="$work/code"
          git -C "$k" init -q 2>/dev/null || { mkdir -p "$k"; git -C "$k" init -q; }
          printf 'feat: catalogo\n\nOpenSpec-Change: add-catalogo\n' | commit "$k" 2026-10-05
          printf 'fix: ajuste antes do archive\n\nOpenSpec-Change: add-catalogo\n' | commit "$k" 2026-10-07
          printf 'fix: corrige ordenacao\n\nOpenSpec-Change: add-catalogo\n' | commit "$k" 2026-10-10
          printf 'fix(ui): corrige layout\n\nOpenSpec-Change: add-catalogo\n' | commit "$k" 2026-10-11
          printf 'fix: sem trailer\n' | commit "$k" 2026-10-12
          printf 'feat: busca\n\nOpenSpec-Change: add-busca\n' | commit "$k" 2026-10-21

          before_store="$(git -C "$work/store" status --porcelain)"
          before_code="$(git -C "$k" status --porcelain)"
          node scripts/flow-metrics.mjs --store "$work/store" --code "$k" --out "$work/out"
          test "$(git -C "$work/store" status --porcelain)" = "$before_store"
          test "$(git -C "$k" status --porcelain)" = "$before_code"
          test "$(ls "$work/out" | sort | tr '\n' ' ')" = "metrics.csv resumo.md "

          csv="$work/out/metrics.csv"
          head -n 1 "$csv" | sed 's/^\xEF\xBB\xBF//' | grep -qx 'change,estado,criada,aprovada,arquivada,dias_ate_aprovacao,dias_execucao,lead_time_dias,requisitos,cenarios,tarefas,tarefas_concluidas,retrabalho,criticos,warnings,sugestoes,nao_verificados,ci_falhas_antes_do_verde'
          grep -qx 'add-catalogo,arquivada,2026-10-01,2026-10-03,2026-10-08,2,5,7,2,3,3,3,2,0,2,1,1,' "$csv"
          grep -qx 'add-busca,arquivada,2026-10-15,,2026-10-20,,,5,0,0,1,1,0,,,,,' "$csv"
          grep -qx 'ativa-x,ativa,2026-10-05,,,,,,0,0,2,1,,,,,,' "$csv"
          grep -qF '| 2026-10 | 2 | 6 |' "$work/out/resumo.md"
          if grep -riE 'fulana|example\.com' "$work/out"; then exit 1; fi

          # Sem --code: retrabalho vazio e o resumo explica o que não foi coletado.
          node scripts/flow-metrics.mjs --store "$work/store" --out "$work/out-sem-code"
          grep -qx 'add-catalogo,arquivada,2026-10-01,2026-10-03,2026-10-08,2,5,7,2,3,3,3,,0,2,1,1,' "$work/out-sem-code/metrics.csv"
          grep -qi 'não coletado' "$work/out-sem-code/resumo.md"

      # Sessões de exemplo do Claude Code: resposta repetida em duas linhas, atribuição por branch e
      # por janela, registro ambíguo, não atribuído e conteúdo sensível que não pode vazar.
      - name: Smoke test do consumo de IA
        run: |
          work="$(mktemp -d)"
          s="$work/store/openspec/changes"
          mkdir -p "$s/ativa-x" "$s/archive/2026-10-08-add-catalogo" "$s/archive/2026-10-20-add-busca" "$work/code" "$work/sessions"
          printf 'schema: spec-driven\ncreated: 2026-10-05\n' > "$s/ativa-x/.openspec.yaml"
          printf 'schema: spec-driven\ncreated: 2026-10-01\n' > "$s/archive/2026-10-08-add-catalogo/.openspec.yaml"
          printf 'schema: spec-driven\ncreated: 2026-10-15\n' > "$s/archive/2026-10-20-add-busca/.openspec.yaml"
          project="$(node -e 'console.log(require("path").resolve(process.argv[1]).replace(/[^A-Za-z0-9]/g, "-"))' "$work/code")"
          mkdir -p "$work/sessions/$project"
          line() { printf '{"type":"assistant","timestamp":"%sT12:00:00.000Z","gitBranch":"%s","cwd":"/x","message":{"id":"%s","model":"claude-test","content":[{"type":"text","text":"%s"}],"usage":{"input_tokens":%s,"output_tokens":%s,"cache_read_input_tokens":%s,"cache_creation_input_tokens":%s}}}\n' "$@"; }
          {
            line 2026-10-02 feat/add-catalogo m1 bloco-a 10 100 1000 50
            line 2026-10-02 feat/add-catalogo m1 bloco-b 10 100 1000 50
            line 2026-10-03 main m2 resposta 5 50 500 0
            printf '{"type":"user","timestamp":"2026-10-16T11:00:00.000Z","gitBranch":"feat/cliente-acme-add-busca","message":{"role":"user","content":"segredo-xyz"}}\n'
            line 2026-10-16 feat/cliente-acme-add-busca m3 segredo-xyz 1 10 100 0
            line 2026-10-06 main m4 ambigua 2 20 200 0
            line 2026-09-01 main m5 antiga 3 30 300 0
            printf 'linha invalida\n'
          } > "$work/sessions/$project/sessao.jsonl"

          node scripts/flow-metrics.mjs --store "$work/store" --usage "$work/code" --usage-dir "$work/sessions" --out "$work/out"
          u="$work/out/uso-ia.csv"
          head -n 1 "$u" | sed 's/^\xEF\xBB\xBF//' | grep -qx 'change,respostas,tokens_entrada,tokens_saida,tokens_cache_leitura,tokens_cache_escrita'
          grep -qx 'add-catalogo,2,15,150,1500,50' "$u"
          grep -qx 'add-busca,1,1,10,100,0' "$u"
          grep -qx 'ativa-x,0,0,0,0,0' "$u"
          grep -qF 'Respostas ambíguas (mais de uma change possível): 1' "$work/out/resumo.md"
          grep -qF 'Respostas não atribuídas: 1' "$work/out/resumo.md"
          if grep -riE 'segredo-xyz|cliente-acme' "$work/out"; then exit 1; fi

          # Pasta sem sessões: colunas vazias e aviso. Sem --usage: nenhum uso-ia.csv.
          mkdir -p "$work/sem-sessao"
          node scripts/flow-metrics.mjs --store "$work/store" --usage "$work/sem-sessao" --usage-dir "$work/sessions" --out "$work/out-vazio"
          grep -qx 'add-catalogo,,,,,' "$work/out-vazio/uso-ia.csv"
          grep -qF 'Nenhuma sessão encontrada' "$work/out-vazio/resumo.md"
          node scripts/flow-metrics.mjs --store "$work/store" --out "$work/out-sem-usage"
          test ! -e "$work/out-sem-usage/uso-ia.csv"

  # A raiz é espelho gerado de padrao-openspec/ e carrega as changes deste repositório.
  root:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Raiz em dia com padrao-openspec
        run: node padrao-openspec/scripts/sync-root.mjs --check

      - name: Instalar OpenSpec CLI
        run: npm install --global @fission-ai/openspec@1.14.2

      - name: Validar specs e changes OpenSpec da raiz
        run: openspec validate --all --strict

      - name: Lint de Markdown da raiz
        run: npx --yes markdownlint-cli2@0.23.2 "**/*.md"

      # Guia de quem vai iniciar um projeto: existe, é linkado pelo README e cobre setup e init.
      - name: Guia de primeiros passos
        run: |
          test -f COMECE-AQUI.md
          grep -qF '](COMECE-AQUI.md)' README.md
          grep -qF 'setup-project.mjs' COMECE-AQUI.md
          grep -qF '/opsx:init' COMECE-AQUI.md
          grep -qF 'git clone --branch v' COMECE-AQUI.md
          grep -qF -- '-openspec switch -c main' COMECE-AQUI.md
          # O início de projeto clona a última release, não a main.
          if grep -nE 'git clone https://github\.com/Gilmar1987/PadraoOpenspct' COMECE-AQUI.md README.md padrao-openspec/README.md; then exit 1; fi
          grep -qF '## Primeiros passos' padrao-openspec/templates/openspec-padrao.md
          # A entrada começa pelo script anexado à última release.
          grep -qF 'releases/latest/download/comecar.mjs' COMECE-AQUI.md
          grep -qF 'releases/latest/download/comecar.mjs' README.md
          grep -qF 'releases/latest/download/comecar.mjs' padrao-openspec/templates/openspec-padrao.md
          grep -qF '## Entrar neste projeto' padrao-openspec/templates/openspec-padrao.md
          grep -qF 'padrao-openspec/scripts/comecar.mjs' README.md
