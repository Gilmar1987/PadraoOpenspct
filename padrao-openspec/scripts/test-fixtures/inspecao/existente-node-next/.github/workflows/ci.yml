name: CI
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pnpm install --frozen-lockfile
      - run: env DATABASE_URL=postgres://ci:VALOR_FALSO_123@localhost/app pnpm prisma migrate deploy
      - name: Verificações
        run: |
          pnpm lint
          pnpm typecheck
          pnpm test
